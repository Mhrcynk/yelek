<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yelek</title>
<meta name="description" content="Halı saha ekibi için FIFA tarzı oyuncu kartları, 7'li dizilişler, maç sonu puanlama ve oylama.">
<meta name="theme-color" content="#1E7A43">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E7A43'/%3E%3Cpath d='M20 14l6 5h12l6-5 10 8-6 9-4-3v24H20V28l-4 3-6-9z' fill='%23F07A1A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Düzen: gece maçı halı saha — sabit üst şerit, tek kolon içerik (max 1000px), dikey tam saha üzerinde iki takım */
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --surface-2:#E2E9DE; --ink:#13261B; --muted:#5A6D60; --line:#C9D5C6;
  --turf:#1E7A43; --turf-2:#196A3A; --on-turf:#F3F8F2; --bib:#F07A1A; --gold:#B8861A;
  --ok:#1E7A43; --bad:#C2392F; --warn:#B9720F; --info:#2D68A6; --chip-bg:rgba(19,38,27,.07);
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1510; --surface:#12211A; --surface-2:#192C22; --ink:#E3EDE5; --muted:#92A799; --line:#284232;
  --turf:#3BA866; --turf-2:#174F2E; --bib:#FF8A2E; --gold:#E2B54A;
  --ok:#47B873; --bad:#EA5E52; --warn:#E5A33F; --info:#6AA6E2; --chip-bg:rgba(227,237,229,.08); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
h2{font-size:1.7rem;font-weight:800} h3{font-size:1.2rem;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:.85rem}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand h1{font-size:2rem;font-weight:900;color:var(--turf);letter-spacing:.04em}
.brand .tag{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;line-height:1.25}
.me{display:flex;align-items:center;gap:6px;font-size:.85rem}
.me select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);max-width:160px}
.adminpill{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--bib);color:#1A0E02;padding:3px 8px;border-radius:99px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 13px;font-family:var(--display);font-weight:800;font-size:1.05rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--bib)}

main{padding-block:18px 60px;display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--turf)}
.btn.primary{background:var(--turf);border-color:var(--turf);color:var(--on-turf)}
.btn.bib{background:var(--bib);border-color:var(--bib);color:#1A0E02}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--chip-bg);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.info{color:var(--info)}.chip.muted{color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--turf);border-radius:99px}

.rsvp{display:grid;gap:2px}
.rsvp-group{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 0 4px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0;flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .grow{flex:1;min-width:140px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini-ovr{font-family:var(--display);font-weight:900;font-size:1.15rem;width:2.1em;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:5px 9px;font-size:.8rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.g{background:var(--ok);color:#fff}.seg button.on.y{background:var(--warn);color:#fff}.seg button.on.n{background:var(--bad);color:#fff}
.seg button:disabled{cursor:default}

/* Takım dağıtımı (iki kolon) */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.split{grid-template-columns:1fr}}
.tcol{background:var(--surface-2);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.tcol h3{display:flex;justify-content:space-between}
.tp{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
.tp .o{font-family:var(--display);font-weight:900;font-size:1.05rem;width:1.8em}
.tp .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tp.sel{border-color:var(--bib);box-shadow:0 0 0 2px var(--bib)}
.cmp{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:1.4rem}
.cmp .bar2{flex:1;height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--surface-2)}
.cmp .bar2 i{display:block;height:100%}
.bibdot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--bib);margin-right:6px;vertical-align:middle}
.nobib{display:inline-block;width:10px;height:10px;border-radius:2px;border:2px solid var(--muted);margin-right:6px;vertical-align:middle}

/* Dikey saha */
.lineup{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.lineup{grid-template-columns:1fr}}
.field{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/100;border-radius:12px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#1E7A43 0 8.33%,#1A6D3B 8.33% 16.66%)}
.field svg.lines{position:absolute;inset:0;width:100%;height:100%}
.formlbl{position:absolute;font-family:var(--display);font-weight:900;font-size:.95rem;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:6px;letter-spacing:.04em}
.tok{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:22%;color:#fff}
.tok .shirt{width:clamp(30px,10.5vw,42px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:clamp(.95rem,3.4vw,1.2rem);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tok.a .shirt{background:#F07A1A;color:#1A0E02}
.tok.b .shirt{background:#F3F6F2;color:#13261B}
.tok .tn{font-size:clamp(.66rem,2.5vw,.8rem);font-weight:700;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .to{font-family:var(--display);font-weight:900;font-size:.72rem;opacity:.9}
.tok.empty .shirt{background:transparent;border:2px dashed rgba(255,255,255,.7);color:#fff;font-size:.75rem;box-shadow:none}
.tok.sel .shirt{outline:3px solid #FFE066;outline-offset:2px}
.tok.gk .shirt{border:3px solid #FFE066}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.field.edit .tok{touch-action:none;cursor:grab}
.field.edit .tok.dragging{cursor:grabbing;z-index:5;transition:none}
.bench .tp{width:auto}

/* Skor */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.score .t{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.1rem}
.score .s{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.scin{width:4.5em!important;text-align:center;font-size:1.6rem;font-family:var(--display);font-weight:900}
.stat-table{width:100%;border-collapse:collapse;font-size:.9rem}
.stat-table th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;font-weight:700;white-space:nowrap}
.stat-table td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
.stat-table .pts{font-family:var(--display);font-weight:900;font-size:1.2rem;text-align:right}
.stat-table select{width:auto}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{border:0;background:var(--surface-2);width:28px;height:28px;font-weight:700}
.step span{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.scroll-x{overflow-x:auto}

/* FUT kartı */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fut{--c1:#E8EBEE;--c2:#AEB5BA;--tx:#1B2328;position:relative;border:0;padding:0;background:none;width:100%;max-width:220px;justify-self:center;aspect-ratio:3/4.3;text-align:left}
.fut .face{position:absolute;inset:0;clip-path:polygon(14% 0,86% 0,100% 7%,100% 88%,50% 100%,0 88%,0 7%);
  background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.55),transparent 55%),linear-gradient(160deg,var(--c1),var(--c2));color:var(--tx);padding:12% 10% 0;display:flex;flex-direction:column}
.fut.gold{--c1:#F6DE8F;--c2:#C8962C;--tx:#2A1D04}
.fut.silver{--c1:#ECEFF1;--c2:#A4ADB3;--tx:#1A2227}
.fut.bronze{--c1:#E8BF96;--c2:#A46A3E;--tx:#2A1608}
.fut.star{--c1:#1F7A43;--c2:#0B2F1B;--tx:#F6DE8F}
.fut .tl{display:flex;flex-direction:column;align-items:center;width:30%;line-height:.9}
.fut .ovr{font-family:var(--display);font-weight:900;font-size:2.2rem}
.fut.big .ovr{font-size:2.7rem}
.fut .ps{font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.04em}
.fut .trend{font-size:.72rem;font-weight:800;margin-top:3px}
.fut .jer{position:absolute;top:10%;right:12%;width:52%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:2.4rem;background:rgba(255,255,255,.18);border:2px solid color-mix(in srgb,var(--tx) 25%,transparent)}
.fut .nm{margin-top:auto;font-family:var(--display);font-weight:900;font-size:1.25rem;text-align:center;text-transform:uppercase;letter-spacing:.03em;border-top:1px solid color-mix(in srgb,var(--tx) 30%,transparent);padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fut .at{display:grid;grid-template-columns:1fr 1fr;column-gap:10%;font-size:.72rem;font-weight:700;padding:4px 4% 18%;font-variant-numeric:tabular-nums}
.fut .at span{display:flex;justify-content:space-between}
.fut .at b{font-family:var(--display);font-size:.95rem}
.fut .flag{position:absolute;left:50%;transform:translateX(-50%) rotate(-6deg);top:44%;font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.06em;padding:3px 10px;border-radius:4px;background:#C2392F;color:#fff;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.fut .flag.info{background:#2D68A6}.fut .flag.warn{background:#B9720F}.fut .flag.muted{background:#5a6670}
.fut.out .face{filter:grayscale(.65) brightness(.92)}
.fut.big{max-width:240px}
.up{color:#14803C}.down{color:#B42318}
.fut.star .up{color:#7CE3A1}.fut.star .down{color:#FF9C92}
@media (prefers-reduced-motion:no-preference){.fut{transition:transform .15s}.fut:hover{transform:translateY(-3px)}}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,8,.55);z-index:40;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;max-width:760px;width:100%;padding:18px;display:grid;gap:16px;border:1px solid var(--line)}
.prof{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media (max-width:600px){.prof{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.kv span{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hist{display:grid}
.hist div{display:grid;grid-template-columns:5em 1fr auto auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem;align-items:center}
.hist .d{color:var(--muted)}
.hist .p{font-family:var(--display);font-weight:900;font-size:1.05rem;text-align:right;min-width:2.2em}
.delta{font-weight:800;min-width:2.4em;text-align:right;font-variant-numeric:tabular-nums}
.delta.pos{color:var(--ok)}.delta.neg{color:var(--bad)}.delta.zero{color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;gap:8px;align-items:center;padding:6px 10px 6px 6px;border-radius:10px;background:var(--surface-2);font-size:.82rem}
.badge i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--gold);color:#241900;font-family:var(--display);font-weight:900}
.badge.shame i{background:var(--muted);color:var(--surface)}
.badge b{display:block;font-size:.85rem}
.statuses{display:flex;flex-wrap:wrap;gap:6px}
.statuses button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.85rem}
.statuses button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.slog{display:grid;gap:4px;font-size:.85rem}
.attrs-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px}
.attrs-in label{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted);min-width:0}
.attrs-in .val{display:flex;gap:8px;align-items:center}
.attrs-in input[type=number]{width:4.2em;flex:none;text-align:center;font-family:var(--display);font-weight:900;font-size:1.2rem;padding:4px}
.attrs-in input[type=range]{flex:1 1 0;width:0;min-width:0;accent-color:var(--turf);margin:0}

.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.board ol{margin:0;padding:0;list-style:none;display:grid}
.board li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.board li:last-child{border-bottom:0}
.board li b{font-family:var(--display);font-size:1.15rem;font-weight:900;font-variant-numeric:tabular-nums}
.board li .rk{color:var(--muted);width:1.4em;display:inline-block;font-variant-numeric:tabular-nums}
.wrapped{display:grid;grid-auto-flow:column;grid-auto-columns:min(280px,82%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.slide{scroll-snap-align:start;border-radius:16px;padding:20px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;color:#F4F8F3;background:linear-gradient(160deg,#1E7A43,#0B2F1B)}
.slide:nth-child(2){background:linear-gradient(160deg,#F07A1A,#7A2E05)}
.slide:nth-child(3){background:linear-gradient(160deg,#2D68A6,#13243F)}
.slide:nth-child(4){background:linear-gradient(160deg,#B8861A,#3D2A04)}
.slide:nth-child(5){background:linear-gradient(160deg,#6B3FA0,#21103A)}
.slide .big{font-family:var(--display);font-weight:900;font-size:4.2rem;line-height:.9}
.slide .lb{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px;font-size:.88rem}
.rules div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.rules b{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:28px 12px;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}
.note{font-size:.85rem;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.note.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.report{background:var(--surface-2);border-radius:10px;padding:14px;font-size:.95rem}
.report strong{display:block;font-family:var(--display);font-size:1.45rem;font-weight:900;text-transform:uppercase;line-height:1.05;margin-bottom:8px}
.timer{font-family:var(--display);font-weight:900;font-size:2rem;font-variant-numeric:tabular-nums}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;display:flex;gap:6px;align-items:center}
.pool button b{font-family:var(--display);font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.vote-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mlist{display:grid}

<script>
(function(){
"use strict";
/* ================= Bağlantı ================= */
const SB_URL="https://tnjpxwxfqbhfxsphbqhq.supabase.co";
const SB_KEY="sb_publishable_ATJ8lPaPBzZEj-4k7Z5Ztw_YGevQCS3";

}

}

/* ================= Sabitler ================= */
const STATUS={hazir:{label:"Hazır",cls:"ok"},sakat:{label:"Sakat",cls:"bad",flag:"SAKAT"},hasta:{label:"Hasta",cls:"bad",flag:"HASTA"},
  izinli:{label:"İzinde / şehir dışı",cls:"info",flag:"İZİNDE"},yogun:{label:"İş yoğun",cls:"warn",flag:"YOĞUN"},belirsiz:{label:"Belirsiz",cls:"muted",flag:"?"}};
const UNAVAIL=["sakat","hasta","izinli","yogun"];
const POS={"Kaleci":"KL","Defans":"DF","Orta saha":"OS","Forvet":"FV"};
const ROLE_NAME={KL:"Kaleci",DF:"Defans",OS:"Orta saha",FV:"Forvet"};
const ATTR_OUT=[["hiz","HIZ","Hız"],["sut","ŞUT","Şut"],["pas","PAS","Pas"],["dri","DRİ","Top sürme"],["def","DEF","Savunma"],["fiz","FİZ","Fizik"]];
const ATTR_GK=[["dal","DAL","Plonjon"],["ell","ELL","Elle oyun"],["ayk","AYK","Ayakla oyun"],["ref","REF","Refleks"],["hiz","HIZ","Hız"],["poz","POZ","Pozisyon alma"]];
const attrSet=pos=>pos==="Kaleci"?ATTR_GK:ATTR_OUT;
const TEAM={A:"Yelekliler",B:"Yeleksizler"};
const TEAM_SIZE=7, CAP=14;
/* 7'li dizilişler: x soldan sağa %, y kendi kalesinden orta sahaya % */
const FORMS={
  "2-3-1":{slots:[[50,7,"KL"],[30,27,"DF"],[70,27,"DF"],[17,55,"OS"],[50,51,"OS"],[83,55,"OS"],[50,83,"FV"]],d:"Dengeli, en çok oynanan düzen"},
  "3-2-1":{slots:[[50,7,"KL"],[20,28,"DF"],[50,23,"DF"],[80,28,"DF"],[32,56,"OS"],[68,56,"OS"],[50,83,"FV"]],d:"Sağlam savunma, kontra atak"},
  "2-1-2-1":{slots:[[50,7,"KL"],[30,25,"DF"],[70,25,"DF"],[50,43,"OS"],[20,63,"OS"],[80,63,"OS"],[50,85,"FV"]],d:"Elmas orta saha, pas oyunu"},
  "2-2-2":{slots:[[50,7,"KL"],[30,27,"DF"],[70,27,"DF"],[30,55,"OS"],[70,55,"OS"],[33,82,"FV"],[67,82,"FV"]],d:"Kanatlardan çift forvet"},
  "3-1-2":{slots:[[50,7,"KL"],[20,28,"DF"],[50,23,"DF"],[80,28,"DF"],[50,51,"OS"],[32,80,"FV"],[68,80,"FV"]],d:"Arkada üç stoper, önde iki golcü"},
  "1-3-2":{slots:[[50,7,"KL"],[50,25,"DF"],[17,52,"OS"],[50,49,"OS"],[83,52,"OS"],[33,80,"FV"],[67,80,"FV"]],d:"Tek libero, hücum ağırlıklı"},
  "3-3":{slots:[[50,7,"KL"],[20,29,"DF"],[50,25,"DF"],[80,29,"DF"],[20,72,"FV"],[50,78,"FV"],[80,72,"FV"]],d:"İki sıra, basit ve net"}
};
const RULES={katilim:1,asist:3,galibiyet:3,beraberlik:1,kk:-2,motm:3,gol:{KL:6,DF:6,OS:5,FV:4},
  savunma:[[0,{KL:8,DF:5,OS:1,FV:0}],[2,{KL:6,DF:4,OS:1,FV:0}],[4,{KL:3,DF:2,OS:0,FV:0}],[7,{KL:0,DF:0,OS:0,FV:0}],[999,{KL:-2,DF:-1,OS:0,FV:0}]],
  ortalama:7,gelmedi:-1,sonDakika:-2,aralik:12};
const AYLAR=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const DEF_SET={group_name:"Salı Ekibi",field_name:"",day:2,time:"21:00"};

/* ================= Durum ================= */
const S={all:[],players:[],matches:[],settings:{...DEF_SET},seasonVotes:[],me:"",pin:"",admin:false,
  tab:"hafta",modal:null,teams:null,draft:null,stats:{},mInfo:{},view:null,f:{},loaded:false,err:null,pending:false};
const LS={get(k){try{return localStorage.getItem(k)||""}catch(_){return""}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
S.tab=LS.get("y_tab")||"hafta";S.me=LS.get("y_me");S.pin=LS.get("y_pin");S.admin=!!S.pin;
if(location.hash&&/^#(hafta|oyuncular|sezon|kurallar|ayarlar)$/.test(location.hash))S.tab=location.hash.slice(1);

/* ================= Yardımcılar ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const up=s=>String(s||"").toLocaleUpperCase("tr-TR");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtDate=s=>{const d=parseYmd(s);return d.getDate()+" "+AYLAR[d.getMonth()]+" "+GUNLER[d.getDay()]};
const fmtShort=s=>{const d=parseYmd(s);return d.getDate()+" "+AYLAR[d.getMonth()].slice(0,3)};
const matchTs=m=>{const d=parseYmd(m.date);const[h,mi]=String(m.time||"21:00").split(":").map(Number);d.setHours(h||0,mi||0,0,0);return d.getTime()};
const nextDay=dow=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+((dow-d.getDay()+7)%7));return ymd(d)};
const P=id=>S.all.find(p=>p.id===id);
const nameOf=id=>P(id)?.name||"Eski oyuncu";
const posOf=p=>POS[p?.pos]||"OS";
const stOf=p=>(p&&p.status&&STATUS[p.status.type])?p.status.type:"hazir";
const initials=n=>String(n||"?").trim().split(/\s+/).map(x=>x[0]||"").join("").slice(0,2).toLocaleUpperCase("tr-TR");
const shortName=n=>{const a=String(n||"").trim().split(/\s+/);return a.length>1?a[0]+" "+a[a.length-1][0]+".":a[0]};
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2800)}
const fin=()=>S.matches.filter(m=>m.state==="bitti").sort((a,b)=>matchTs(a)-matchTs(b));
const sideOf=(m,pid)=>(m.team_a||[]).includes(pid)?"A":(m.team_b||[]).includes(pid)?"B":null;
const lineupOf=(m,k)=>(k==="A"?m.lineup_a:m.lineup_b)||[];
const formOf=(m,k)=>FORMS[k==="A"?m.form_a:m.form_b]?(k==="A"?m.form_a:m.form_b):"2-3-1";
function roleIn(m,pid,side){
  const L=lineupOf(m,side);const i=L.indexOf(pid);if(i===0)return"KL";
  const PS=side==="A"?m.pos_a:m.pos_b;if(i>0&&PS&&PS.length===TEAM_SIZE&&PS[i])return PS[i][2];
  const F=FORMS[side==="A"?m.form_a:m.form_b];if(i>0&&F&&F.slots[i])return F.slots[i][2];
  const p=posOf(P(pid));return p==="KL"?"DF":p;
}
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};

/* ================= Puanlama ================= */
function topVote(m,key){const t={};for(const v of Object.values(m.votes||{})){const id=v&&v[key];if(id)t[id]=(t[id]||0)+1}
  const e=Object.entries(t).sort((a,b)=>b[1]-a[1]);if(!e.length)return null;if(e[1]&&e[1][1]===e[0][1])return null;return e[0][0]}
function matchPoints(m,pid,motmId){
  const side=sideOf(m,pid);if(!side)return null;const role=roleIn(m,pid,side);const st=(m.stats||{})[pid]||{};
  const my=side==="A"?+m.score_a||0:+m.score_b||0,op=side==="A"?+m.score_b||0:+m.score_a||0;
  const parts=[];let pts=0;const add=(l,v)=>{if(v){parts.push([l,v]);pts+=v}};
  const g=+st.g||0,a=+st.a||0,og=+st.og||0,bon=+st.bonus||0;
  add("Katılım",RULES.katilim);add(g+" gol",g*RULES.gol[role]);add(a+" asist",a*RULES.asist);
  add(my>op?"Galibiyet":"Beraberlik",my>op?RULES.galibiyet:my===op?RULES.beraberlik:0);
  for(const[lim,v]of RULES.savunma){if(op<=lim){add(op===0?"Gol yemedi":op+" gol yedi",v[role]);break}}
  add("Kendi kalesine",og*RULES.kk);add("Maçın Adamı",motmId===pid?RULES.motm:0);add("Hoca puanı",bon);
  return{pts,parts,role,g,a,res:my>op?"G":my<op?"M":"B",side,op};
}
const ptsToDelta=p=>clamp(Math.round((p-RULES.ortalama)/2.5),-2,3)||0;
function baseOf(p){const set=attrSet(p.pos);const a=p.attrs||{};return Math.round(set.reduce((s,[k])=>s+(+a[k]||65),0)/set.length)}
function compute(){
  const F=fin();const mInfo={};const out={};
  for(const m of F){const motm=topVote(m,"motm"),fiy=topVote(m,"fiyasko"),gol=topVote(m,"gol");
    const pl=[...(m.team_a||[]),...(m.team_b||[])];const pts={};for(const id of pl)pts[id]=matchPoints(m,id,motm);
    const totw=pl.filter(id=>pts[id]&&P(id)).sort((a,b)=>pts[b].pts-pts[a].pts).slice(0,5);mInfo[m.id]={motm,fiy,gol,pts,totw}}
  for(const p of S.all){
    const base=baseOf(p);let ovr=base;const joined=p.created_at?new Date(new Date(p.created_at).toDateString()).getTime():0;
    const hist=[],series=[base];let games=0,goals=0,ast=0,W=0,D=0,L=0,motm=0,fiy=0,golu=0,totw=0,hat=0,elig=0,streak=0,best=0,late=0,cs=0,ptsSum=0,bestM=null;
    for(const m of F){
      if(matchTs(m)<joined)continue;elig++;const inf=mInfo[m.id];const r=inf.pts[p.id];let d,line;
      if(r){games++;streak++;best=Math.max(best,streak);goals+=r.g;ast+=r.a;if(r.g>=3)hat++;
        if(r.res==="G")W++;else if(r.res==="B")D++;else L++;
        if(inf.motm===p.id)motm++;if(inf.fiy===p.id)fiy++;if(inf.gol===p.id)golu++;if(inf.totw.includes(p.id))totw++;
        if(r.op<=2&&(r.role==="KL"||r.role==="DF"))cs++;ptsSum+=r.pts;if(!bestM||r.pts>bestM.pts)bestM={pts:r.pts,date:m.date};
        d=ptsToDelta(r.pts);line={kind:"oynadi",r};
      }else{streak=0;const lc=!!(m.late||{})[p.id];if(lc)late++;d=lc?RULES.sonDakika:RULES.gelmedi;line={kind:lc?"iptal":"gelmedi"}}
      const before=ovr;ovr=clamp(ovr+d,Math.max(40,base-RULES.aralik),Math.min(99,base+RULES.aralik));
      hist.push({m,d:ovr-before,ovr,...line});series.push(ovr);
    }
    const last=hist[hist.length-1];const a=p.attrs||{};const last5=hist.slice(-5);
    const g5=last5.reduce((s,h)=>s+(h.r?h.r.g:0),0),a5=last5.reduce((s,h)=>s+(h.r?h.r.a:0),0),miss5=last5.filter(h=>!h.r).length;
    const cs5=last5.filter(h=>h.r&&(h.r.role==="KL"||h.r.role==="DF")&&h.r.op<=2).length;
    const sh=Math.round((ovr-base)/3);const v=k=>clamp((+a[k]||65)+sh,30,99);
    const attrs=p.pos==="Kaleci"?{dal:v("dal"),ell:v("ell"),ayk:v("ayk"),ref:clamp(v("ref")+Math.min(4,cs5*2),30,99),hiz:v("hiz"),poz:v("poz")}
      :{hiz:v("hiz"),sut:clamp(v("sut")+Math.min(4,g5),30,99),pas:clamp(v("pas")+Math.min(4,a5),30,99),dri:v("dri"),def:clamp(v("def")+Math.min(4,cs5*2),30,99),fiz:clamp(v("fiz")-miss5*2,30,99)};
    const badges=[];
    if(hat)badges.push({i:"3",t:"Hat-trick",d:hat+" kez tek maçta 3+ gol"});
    if(motm)badges.push({i:"★",t:"Maçın Adamı",d:motm+" kez seçildi"});
    if(totw)badges.push({i:"XI",t:"Haftanın Takımı",d:totw+" kez ilk beşte"});
    if(goals>=10)badges.push({i:"10",t:"Golcü",d:goals+" gol attı"});
    if(ast>=10)badges.push({i:"A",t:"Pasör",d:ast+" asist yaptı"});
    if(best>=8)badges.push({i:"8",t:"Demir Adam",d:best+" maç üst üste geldi"});
    if(cs>=3)badges.push({i:"0",t:"Duvar",d:cs+" maçta en fazla 2 gol yedi"});
    if(elig>=5&&games/elig>=.9)badges.push({i:"%",t:"Sadık",d:"Maçların %"+Math.round(games/elig*100)+"'ine geldi"});
    if(golu)badges.push({i:"G",t:"Haftanın Golü",d:golu+" kez"});
    if(fiy>=2)badges.push({i:"?!",t:"Fiyasko Ustası",d:fiy+" kez seçildi",shame:true});
    if(late>=2)badges.push({i:"!",t:"Son Dakikacı",d:late+" kez son gün iptal",shame:true});
    out[p.id]={base,ovr,hist,series,games,goals,ast,W,D,L,motm,fiy,golu,totw,elig,best,late,ptsSum,bestM,avgPts:games?ptsSum/games:null,att:elig?games/elig:null,lastD:last?last.d:0,attrs,badges};
  }
  S.stats=out;S.mInfo=mInfo;
}
const ovrOf=id=>S.stats[id]?.ovr??(P(id)?baseOf(P(id)):60);
const tierOf=o=>o>=85?"star":o>=75?"gold":o>=65?"silver":"bronze";

/* ================= Veri ================= */
async function load(){
  try{
    const yr=new Date().getFullYear();
    const[st,pl,ms,sv]=await Promise.all([sbGet("settings?id=eq.1&select=*"),sbGet("players?select=*&order=created_at.asc"),
      sbGet("matches?select=*&archived=eq.false&order=date.desc&limit=400"),sbGet("season_votes?select=*&year=eq."+yr)]);
    S.settings={...DEF_SET,...(st[0]||{})};S.all=pl;S.players=pl.filter(p=>!p.archived);S.matches=ms;S.seasonVotes=sv;S.loaded=true;S.err=null;
  }catch(e){console.error(e);S.err="Verilere ulaşılamadı. İnternet bağlantını kontrol edip sayfayı yenile.";}
  render();
}
async function act(fn,args,okMsg){
  try{const r=await rpc(fn,args);
    if(r&&r.ok===false){
      if(r.error==="pin"||r.error==="locked"){S.admin=false;S.pin="";LS.del("y_pin");toast(r.error==="locked"?"Çok fazla hatalı deneme. 15 dakika sonra tekrar dene.":"Yönetici şifresi geçersiz, tekrar giriş yap.");}
      else toast({closed:"Bu maç şu an bu işleme kapalı.",not_played:"Bu maçta oynamadığın için oy veremezsin.",self:"Kendine oy veremezsin.",short:"Yeni şifre en az 6 karakter olmalı."}[r.error]||"İşlem yapılamadı.");
      await load();return null}
    if(okMsg)toast(okMsg);await load();return r||{ok:true};
  }catch(e){console.error(e);toast("Kaydedilemedi. Bağlantını kontrol et.");return null}
}
const A=(fn,args,ok)=>act(fn,{p_pin:S.pin,...args},ok);

/* ================= Render ================= */
function isEditing(){const a=document.activeElement;if(!a||a===document.body)return false;if(!(a.closest("#view")||a.closest("#modal")))return false;
  return a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!["button","checkbox","radio","range"].includes(a.type))}
function render(force){
  if(!force&&isEditing()){S.pending=true;return}
  S.pending=false;compute();
  const s=S.settings;
  $("#gsub").innerHTML=esc(s.group_name)+"<br>"+esc(GUNLER[+s.day])+" "+esc(s.time)+(s.field_name?" · "+esc(s.field_name):"");
  $("#adminPill").innerHTML=S.admin?'<span class="adminpill">Yönetici</span>':"";
  const sel=$("#meSel");const opts='<option value="">Kimim?</option>'+[...S.players].sort((a,b)=>a.name.localeCompare(b.name,"tr")).map(p=>`<option value="${esc(p.id)}"${p.id===S.me?" selected":""}>${esc(p.name)}</option>`).join("");
  if(sel.innerHTML!==opts)sel.innerHTML=opts;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab?"true":"false"));
  let h="";if(S.err)h+=`<div class="note warn">${esc(S.err)}</div>`;
  if(!S.loaded&&!S.err)h+=`<section class="panel"><div class="empty"><h3>Yükleniyor</h3></div></section>`;
  else h+=({hafta:viewHafta,oyuncular:viewKartlar,sezon:viewSezon,kurallar:viewKurallar,ayarlar:viewAyarlar}[S.tab]||viewHafta)();
  $("#view").innerHTML=h;$("#modal").innerHTML=S.modal?viewModal():"";
}

/* ================= Kart ================= */
function card(p,big){
  const s=S.stats[p.id]||{ovr:baseOf(p),attrs:p.attrs||{},lastD:0};const st=stOf(p);const o=s.ovr;
  const tr=s.lastD>0?`<span class="trend up">▲${s.lastD}</span>`:s.lastD<0?`<span class="trend down">▼${-s.lastD}</span>`:`<span class="trend">&nbsp;</span>`;
  const at=attrSet(p.pos).map(([k,l])=>`<span>${l}<b>${s.attrs?.[k]??"–"}</b></span>`).join("");
  const x=STATUS[st];const flag=st!=="hazir"?`<span class="flag ${x.cls==="bad"?"":x.cls}">${x.cls==="bad"?"✚ ":""}${x.flag}</span>`:"";
  return `<button class="fut ${tierOf(o)}${UNAVAIL.includes(st)?" out":""}${big?" big":""}" data-act="open" data-id="${esc(p.id)}" aria-label="${esc(p.name)} kartı, reyting ${o}">
    <span class="face"><span class="tl"><span class="ovr num">${o}</span><span class="ps">${posOf(p)}</span>${tr}</span>
    <span class="jer">${esc(p.no||initials(p.name))}</span><span class="nm">${esc(up(shortName(p.name)))}</span><span class="at">${at}</span></span>${flag}</button>`;
}
function stChip(p){const st=stOf(p);if(st==="hazir")return"";const x=STATUS[st];const u=p.status?.until?" · "+fmtShort(p.status.until)+"'e kadar":"";return`<span class="chip ${x.cls}"><span class="dot"></span>${x.label}${u}</span>`}

/* ================= Bu hafta ================= */

function gkCounts(){const c={};for(const m of S.matches){const a=(m.lineup_a||[])[0],b=(m.lineup_b||[])[0];if(a)c[a]=(c[a]||0)+1;if(b)c[b]=(c[b]||0)+1}return c}

  const n=ids.length,half=Math.floor(n/2);if(half<1)return{A:ids,B:[]};
  const ov=Object.fromEntries(ids.map(id=>[id,ovrOf(id)]));const kl=ids.filter(id=>posOf(P(id))==="KL");const res=[];const first=ids[0],rest=ids.slice(1);
  const cnt=(T,r)=>T.filter(x=>posOf(P(x))===r).length;
  const rec=(start,pick)=>{
    if(pick.length===half-1){const Ta=[first,...pick];const Tb=ids.filter(x=>!Ta.includes(x));
      const sa=Ta.reduce((s,x)=>s+ov[x],0)/Ta.length,sb=Tb.reduce((s,x)=>s+ov[x],0)/Tb.length;let sc=Math.abs(sa-sb);
      if(kl.length>=2&&(kl.every(k=>Ta.includes(k))||kl.every(k=>Tb.includes(k))))sc+=50;
      for(const r of["DF","OS","FV"])sc+=Math.max(0,Math.abs(cnt(Ta,r)-cnt(Tb,r))-1)*.6;res.push([sc,Ta,Tb]);return}
    for(let i=start;i<rest.length;i++){pick.push(rest[i]);rec(i+1,pick);pick.pop();if(res.length>60000)return}};
  rec(0,[]);res.sort((a,b)=>a[0]-b[0]);const best=res[0][0];const near=res.filter(r=>r[0]<=best+.4).slice(0,40);const pk=near[Math.floor(Math.random()*near.length)];

    <div class="tcol"><h3><span><span class="nobib"></span>${TEAM.B}</span><span class="num">${sumAvg(d.B)}</span></h3>${d.B.map(id=>`<div class="tp"><span class="o num">${ovrOf(id)}</span><span class="n">${esc(nameOf(id))}</span></div>`).join("")}</div></div>`;

/* İstatistik girişi */
function statEntry(m){
  const k="sd_"+m.id;const sd=S.f[k]||(S.f[k]={a:m.score_a??"",b:m.score_b??"",stats:JSON.parse(JSON.stringify(m.stats||{}))});
  const tmp={...m,score_a:+sd.a||0,score_b:+sd.b||0,stats:sd.stats};
  const rows=side=>(side==="A"?m.team_a:m.team_b).map(id=>{const st=sd.stats[id]||{};const r=matchPoints(tmp,id,null);
    return `<tr><td><b>${esc(nameOf(id))}</b><br><span class="muted small">${ROLE_NAME[r.role]}</span></td><td>${stepper(m.id,id,"g",st.g)}</td><td>${stepper(m.id,id,"a",st.a)}</td><td>${stepper(m.id,id,"og",st.og)}</td>
    <td><select data-act-change="bonus" data-m="${esc(m.id)}" data-p="${esc(id)}" aria-label="Hoca puanı">${[-3,-2,-1,0,1,2,3].map(v=>`<option value="${v}"${(+st.bonus||0)===v?" selected":""}>${v>0?"+"+v:v}</option>`).join("")}</select></td><td class="pts num">${r.pts}</td></tr>`}).join("");
  const tbl=side=>`<div class="scroll-x"><table class="stat-table"><thead><tr><th>${side==="A"?'<span class="bibdot"></span>':'<span class="nobib"></span>'}${TEAM[side]}</th><th>Gol</th><th>Asist</th><th>K.K.</th><th>Hoca</th><th style="text-align:right">Puan</th></tr></thead><tbody>${rows(side)}</tbody></table></div>`;
  const sum=(T,key)=>T.reduce((s,id)=>s+(+sd.stats[id]?.[key]||0),0);
  const gA=sum(m.team_a,"g")+sum(m.team_b,"og"),gB=sum(m.team_b,"g")+sum(m.team_a,"og");
  const warn=(sd.a!==""&&gA>+sd.a)||(sd.b!==""&&gB>+sd.b);
  return `<div class="panel" style="background:var(--surface-2)"><div><div class="eyebrow">Yönetici · maç sonu</div><h3>Skoru ve istatistikleri gir</h3></div>
    <div class="score"><label class="f" for="scA" style="justify-items:center"><span class="t"><span class="bibdot"></span>${TEAM.A}</span><input id="scA" class="scin" type="number" min="0" max="60" inputmode="numeric" data-score="a" data-m="${esc(m.id)}" value="${esc(sd.a)}"></label>
    <span class="s">–</span><label class="f" for="scB" style="justify-items:center"><span class="t"><span class="nobib"></span>${TEAM.B}</span><input id="scB" class="scin" type="number" min="0" max="60" inputmode="numeric" data-score="b" data-m="${esc(m.id)}" value="${esc(sd.b)}"></label></div>
    ${tbl("A")}${tbl("B")}${warn?`<div class="note warn">Girilen goller skordan fazla görünüyor. Kontrol et.</div>`:""}
    <p class="muted small">Puan, oyuncunun dizilişteki yerine göre hesaplanır. Maçın Adamı oylamasının +${RULES.motm} puanı oylamadan sonra eklenir. K.K. = kendi kalesine gol.</p>
    <div class="row"><button class="btn primary" data-act="finish" data-id="${esc(m.id)}" ${sd.a===""||sd.b===""?"disabled":""}>Maçı bitir, kartları güncelle</button></div></div>`;
}
function stepper(mid,pid,k,v){v=+v||0;return `<span class="step"><button data-act="st" data-m="${esc(mid)}" data-p="${esc(pid)}" data-k="${k}" data-d="-1" aria-label="azalt">−</button><span>${v}</span><button data-act="st" data-m="${esc(mid)}" data-p="${esc(pid)}" data-k="${k}" data-d="1" aria-label="artır">+</button></span>`}

  const line=k=>(k==="A"?m.team_a:m.team_b).filter(id=>(+stt[id]?.g||0)>0).map(id=>`${esc(shortName(nameOf(id)))}${+stt[id].g>1?" ×"+stt[id].g:""}`).join(", ");
  let h=`<section class="panel"><div class="panel-head"><div><div class="eyebrow">Maç sonucu${S.settings.field_name?" · "+esc(S.settings.field_name):""}</div><h2>${fmtDate(m.date)}</h2></div>${S.admin?`<button class="btn ghost sm" data-act="reopen" data-id="${esc(m.id)}">Sonucu düzelt</button>`:""}</div>

  if(inf.totw.length)h+=`<div><div class="eyebrow">Haftanın takımı · en çok puan alan beş oyuncu</div><div class="cards" style="margin-top:8px">${inf.totw.map(id=>P(id)?card(P(id)):"").join("")}</div></div>`;
  const ranked=pl.filter(id=>inf.pts[id]).sort((a,b)=>inf.pts[b].pts-inf.pts[a].pts);
  h+=`<details><summary>Oyuncu puanları ve kart değişimleri</summary><div class="hist" style="margin-top:8px">`+ranked.map(id=>{const r=inf.pts[id];const hh=(S.stats[id]?.hist||[]).find(x=>x.m.id===m.id);const d=hh?hh.d:0;
    return `<div><span class="d">${r.side==="A"?'<span class="bibdot"></span>':'<span class="nobib"></span>'}${r.role}</span><span>${esc(nameOf(id))} <span class="muted small">${r.parts.filter(x=>x[0]!=="Katılım").map(x=>x[0]).join(" · ")}</span></span><span class="p num">${r.pts}</span><span class="delta ${d>0?"pos":d<0?"neg":"zero"}">${d>0?"+"+d:d}</span></div>`}).join("")+`</div></details>`;
  h+=`<details><summary>Kadrolar ve diziliş</summary><div style="margin-top:10px">${teamsView(m)}</div></details>`;
  const votes=m.votes||{};const vc=Object.keys(votes).length;
  const aw=(lbl,id)=>`<div class="kv" style="grid-template-columns:1fr"><div><span>${lbl}</span><b style="font-size:1.25rem">${id?esc(nameOf(id)):"—"}</b></div></div>`;
  h+=`<div><div class="panel-head"><h3>Oylama</h3><span class="muted small">${vc}/${pl.length} oyuncu oy verdi</span></div><div class="grid2" style="margin-top:8px">${aw("Maçın Adamı (+"+RULES.motm+" puan)",inf.motm)}${aw("Haftanın Fiyaskosu",inf.fiy)}${aw("Haftanın Golü",inf.gol)}</div></div>`;
  const me=S.me;
  if(!me)h+=`<div class="note">Oy vermek için üstten kim olduğunu seç.</div>`;
  else if(!pl.includes(me))h+=`<p class="muted small">Bu maçta oynamadığın için oy veremezsin.</p>`;
  else{const mine=votes[me]||{};const vk="v_"+m.id;const vd=S.f[vk]||(S.f[vk]={motm:mine.motm||"",fiyasko:mine.fiyasko||"",gol:mine.gol||""});const others=pl.filter(id=>id!==me);
    const opt=(list,cur)=>`<option value="">Seç</option>`+list.map(id=>`<option value="${esc(id)}"${cur===id?" selected":""}>${esc(nameOf(id))}</option>`).join("");const sc=scorers.filter(id=>id!==me);
    h+=`<div class="vote-grid"><label class="f" for="vMotm">Maçın Adamı<select id="vMotm" data-vote="motm" data-m="${esc(m.id)}">${opt(others,vd.motm)}</select></label>
      <label class="f" for="vFiy">Haftanın Fiyaskosu<select id="vFiy" data-vote="fiyasko" data-m="${esc(m.id)}">${opt(others,vd.fiyasko)}</select></label>
      ${sc.length?`<label class="f" for="vGol">Haftanın Golü<select id="vGol" data-vote="gol" data-m="${esc(m.id)}">${opt(sc,vd.gol)}</select></label>`:""}</div>
      <div class="row"><button class="btn primary" data-act="vote" data-id="${esc(m.id)}">${votes[me]?"Oyumu güncelle":"Oyumu gönder"}</button>${votes[me]?'<span class="chip ok"><span class="dot"></span>Oyun kayıtlı</span>':""}</div>`}
  h+=`<div><h3>Spiker</h3><div class="report" style="margin-top:8px">${spiker(m,inf)}</div></div>`;
  return h+`</section>`;
}
function spiker(m,inf){
  const r=hash(m.id);const pick=arr=>arr[r%arr.length];const sa=+m.score_a||0,sb=+m.score_b||0;const stt=m.stats||{};
  const W=sa>sb?"A":sb>sa?"B":null;const Lz=W==="A"?"B":"A";const diff=Math.abs(sa-sb);
  const pl=[...(m.team_a||[]),...(m.team_b||[])];
  const top=pl.filter(id=>+stt[id]?.g).sort((a,b)=>(+stt[b].g)-(+stt[a].g))[0];const tg=top?+stt[top].g:0;
  const ast=pl.filter(id=>+stt[id]?.a).sort((a,b)=>(+stt[b].a)-(+stt[a].a))[0];
  const N=id=>nameOf(id);const up2=s=>up(s);
  let head;
  if(tg>=3)head=pick([`${up2(N(top))} GECEYE DAMGA VURDU`,`${up2(N(top))} DURDURULAMADI: ${tg} GOL`,`HAT-TRICK ALARMI: ${up2(N(top))}`]);
  else if(!W)head=pick([`DOSTLAR ALIŞVERİŞTE GÖRSÜN: ${sa}-${sb}`,`KAZANAN YOK, KONUŞAN ÇOK`,`NEFES KESEN BERABERLİK`]);
  else if(diff>=5)head=pick([`${up2(TEAM[W])} SAHAYI DÜMDÜZ ETTİ`,`${up2(TEAM[Lz])} İÇİN KARA GECE`,`FARK ${diff}: ${up2(TEAM[W])} ACIMADI`]);
  else if(diff===1)head=pick([`TEK FARK, BÜYÜK SEVİNÇ`,`${up2(TEAM[W])} SON SÖZÜ SÖYLEDİ`,`NEFESLER TUTULDU, ${up2(TEAM[W])} GÜLDÜ`]);
  else head=pick([`${up2(TEAM[W])} GÜLEN TARAF OLDU`,`${up2(TEAM[W])} İŞİNİ BİLDİ`,`ZAFER ${up2(TEAM[W])}'İN`]);
  const fld=S.settings.field_name?S.settings.field_name+" sahasında":"sahada";
  let body=`${fmtDate(m.date)} akşamı ${fld} oynanan karşılaşma ${W?`${TEAM[W]}'in ${Math.max(sa,sb)}-${Math.min(sa,sb)}'lik galibiyetiyle`:`${sa}-${sb} beraberlikle`} sona erdi. `;
  if(top)body+=tg>=3?`Gecenin yıldızı ${tg} golle ${N(top)} oldu; rakip savunma bu ismi uzun süre unutmayacak. `:`Gol yollarında en etkili isim ${tg} golle ${N(top)} oldu. `;
  if(ast)body+=`${N(ast)} ${+stt[ast].a} asistle oyunun beyni görevini üstlendi. `;
  for(const k of["A","B"]){const gk=lineupOf(m,k)[0];const conc=k==="A"?sb:sa;if(gk){if(conc===0)body+=`${N(gk)} kalesini gole kapattı, tribünler ayakta. `;else if(conc>=8)body+=`${N(gk)} için zor bir geceydi: kalesinde ${conc} gol gördü. `}}
  if(inf.motm)body+=`Oyuncuların oylarıyla Maçın Adamı ${N(inf.motm)} seçildi. `;
  if(inf.fiy)body+=`Haftanın Fiyaskosu ise ${N(inf.fiy)}; soyunma odasında bu konu daha çok konuşulur.`;
  return `<strong>${esc(head)}</strong>${esc(body.trim())}`;
}

      <p class="muted small">Kadrodan çıkarılan oyuncunun geçmiş maçları silinmez.</p></div></details>`}

function spark(arr){if(arr.length<2)return"";const W=220,H=46,mn=Math.min(...arr)-1,mx=Math.max(...arr)+1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*(W-8)+4,H-4-(v-mn)/(mx-mn)*(H-8)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const l=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Reyting değişimi"><path d="${d} L${l[0]} ${H} L4 ${H}Z" fill="var(--turf)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--turf)" stroke-width="2"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="var(--bib)"/></svg>`}

function viewSezon(){

  for(const m of F){const inf=S.mInfo[m.id];for(const[id,r]of Object.entries(inf.pts)){if(!ys[id]||!r)continue;ys[id].games++;ys[id].g+=r.g;ys[id].a+=r.a;ys[id].pts+=r.pts}
    if(inf.motm&&ys[inf.motm])ys[inf.motm].motm++;if(inf.fiy&&ys[inf.fiy])ys[inf.fiy].fiy++}
  const board=(t,key,fmt,filt)=>{const l=S.players.filter(p=>filt?filt(ys[p.id]):ys[p.id][key]>0).sort((a,b)=>key==="avg"?ys[b.id].pts/ys[b.id].games-ys[a.id].pts/ys[a.id].games:ys[b.id][key]-ys[a.id][key]).slice(0,5);
    return `<div class="panel board"><h3>${t}</h3>${l.length?`<ol>${l.map((p,i)=>`<li><span><span class="rk">${i+1}</span>${esc(p.name)}</span><b>${fmt(ys[p.id])}</b></li>`).join("")}</ol>`:'<p class="muted small">Henüz veri yok.</p>'}</div>`};
  let h=`<section class="panel"><div><div class="eyebrow">${yr} sezonu · ${F.length} maç</div><h2>Sezon</h2></div>${F.length?"":`<div class="empty"><h3>Sezon yeni başlıyor</h3><p>İlk maç bitip istatistikler girilince krallık tabloları burada dolacak.</p></div>`}</section>`;
  if(F.length)h+=`<div class="boards">${board("Gol krallığı","g",x=>x.g)}${board("Asist krallığı","a",x=>x.a)}${board("Maçın Adamı","motm",x=>x.motm+"×")}${board("Puan ortalaması","avg",x=>(x.pts/x.games).toFixed(1),x=>x.games>=3)}${board("Demir adamlar","games",x=>x.games)}${board("Fiyasko listesi","fiy",x=>x.fiy+"×")}</div>`;
  const wp=P(S.f.wrapP||S.me);
  h+=`<section class="panel"><div class="panel-head"><div><div class="eyebrow">Yıl özeti</div><h3>${wp?esc(wp.name)+" · "+yr:"Bir oyuncu seç"}</h3></div>
    <label class="f" for="wrapSel">Oyuncu<select id="wrapSel" data-bind="wrapP"><option value="">Seç</option>${S.players.map(p=>`<option value="${esc(p.id)}"${wp&&wp.id===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select></label></div>`;
  if(wp){const y=ys[wp.id]||{};const s=S.stats[wp.id]||{};const bm=s.bestM&&parseYmd(s.bestM.date).getFullYear()===yr?s.bestM:null;const diff=(s.ovr||0)-(s.base||0);
    h+=`<div class="wrapped"><div class="slide"><span class="lb">Bu yıl sahaya çıktın</span><span class="big num">${y.games||0}</span><span>maç. ${s.best>=4?"En uzun serin "+s.best+" maç üst üste.":"Seneye daha sık bekliyoruz."}</span></div>
      <div class="slide"><span class="lb">Gol + asist</span><span class="big num">${(y.g||0)+(y.a||0)}</span><span>${y.g||0} gol, ${y.a||0} asist.</span></div>
      <div class="slide"><span class="lb">En iyi maçın</span><span class="big num">${bm?bm.pts:"–"}</span><span>${bm?fmtDate(bm.date)+" maçında aldığın puan.":"Henüz puanlı maç yok."}</span></div>
      <div class="slide"><span class="lb">Kartın şimdi</span><span class="big num">${s.ovr||"–"}</span><span>Başlangıçtan ${diff>0?"+"+diff:diff} puan.${y.motm?" "+y.motm+" kez Maçın Adamı seçildin.":""}</span></div>
      <div class="slide"><span class="lb">Rozetler</span><span class="big num">${(s.badges||[]).filter(b=>!b.shame).length}</span><span>${(s.badges||[]).map(b=>esc(b.t)).join(", ")||"Daha rozet yok."}</span></div></div>`}
  h+=`</section>`;
  const tally={};S.seasonVotes.forEach(v=>tally[v.target]=(tally[v.target]||0)+1);const ranked=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const mine=(S.seasonVotes.find(v=>v.voter===S.me)||{}).target||"";
  h+=`<section class="panel"><div class="panel-head"><div><div class="eyebrow">Yıl sonu ödülü</div><h2>Altın Top ${yr}</h2></div><span class="muted small">${S.seasonVotes.length} oy</span></div>
    ${S.me?`<div class="row"><select id="atVote" data-bind="atVote" aria-label="Altın Top oyu" style="width:auto"><option value="">Oyunu seç</option>${S.players.filter(p=>p.id!==S.me).map(p=>`<option value="${esc(p.id)}"${(S.f.atVote||mine)===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select><button class="btn primary" data-act="atVote">${mine?"Oyumu değiştir":"Oy ver"}</button></div>`:'<div class="note">Oy vermek için üstten kim olduğunu seç.</div>'}
    ${ranked.length?`<div class="board"><ol>${ranked.slice(0,5).map(([id,n],i)=>`<li><span><span class="rk">${i+1}</span>${esc(nameOf(id))}</span><b>${n}</b></li>`).join("")}</ol></div>`:'<p class="muted small">Henüz oy yok. Herkes kendi dışında bir oyuncuya oy verir.</p>'}</section>`;

});
function tapSlot(k,i){const t=S.teams;const L=t["l"+k.toLowerCase()];const s=t.sel;
  if(!s){t.sel={kind:"slot",team:k,idx:i};return}
  if(s.team!==k){t.sel={kind:"slot",team:k,idx:i};return}
  if(s.kind==="slot"){if(s.idx!==i)[L[s.idx],L[i]]=[L[i],L[s.idx]];t.sel=null;return}
  L[i]=s.pid;t.sel=null}
function tapBench(k,pid){const t=S.teams;const s=t.sel;
  if(s&&s.kind==="slot"&&s.team===k){t["l"+k.toLowerCase()][s.idx]=pid;t.sel=null;return}
  t.sel=(s&&s.kind==="bench"&&s.pid===pid)?null:{kind:"bench",team:k,pid}}
function cleanAttrs(pos,a){const o={};for(const[k]of attrSet(pos))o[k]=clamp(Math.round(+a[k]||65),30,95);return o}
document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const kind=f.dataset.form;
  if(kind==="addPlayer"){const ap=S.f.ap;const name=String(ap.name||"").trim();if(!name){toast("Ad gir");return}
    const r=await A("admin_save_player",{p_id:null,p_name:name,p_pos:ap.pos,p_no:String(ap.no||"").slice(0,2),p_attrs:cleanAttrs(ap.pos,ap.attrs)},name+" kadroya eklendi");
    if(r){S.f.ap={name:"",pos:ap.pos,no:"",attrs:{}};render(true);setTimeout(()=>$("#apName")?.focus(),0)}}
  if(kind==="login"){const pin=String(S.f.pin||"");if(!pin){toast("Şifreyi gir");return}
    try{const r=await rpc("admin_check",{p_pin:pin});if(r&&r.ok){S.pin=pin;S.admin=true;LS.set("y_pin",pin);S.f.pin="";toast("Yönetici olarak giriş yapıldı");render(true)}
      else toast(r&&r.error==="locked"?"Çok fazla hatalı deneme. 15 dakika sonra tekrar dene.":"Şifre hatalı")}catch(_){toast("Bağlantı hatası")}}
  if(kind==="settings"){const s=S.f.set;await A("admin_save_settings",{p_group:s.group_name,p_field:s.field_name,p_day:+s.day,p_time:s.time||"21:00"},"Ayarlar kaydedildi");S.f.set=null;render(true)}
  if(kind==="pinChange"){const np=String(S.f.newPin||"");if(np.length<6){toast("Yeni şifre en az 6 karakter olmalı");return}
    const r=await A("admin_change_pin",{p_new:np},"Şifre değiştirildi");if(r){S.pin=np;LS.set("y_pin",np);S.f.newPin=""}}
});
function setPath(path,v){const ks=path.split(".");let o=S.f;for(let i=0;i<ks.length-1;i++)o=o[ks[i]]||(o[ks[i]]={});o[ks[ks.length-1]]=v}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.bind)setPath(t.dataset.bind,t.value);
  if(t.dataset.attr){const pre=t.dataset.attr,k=t.dataset.k;const obj=S.f[pre];if(!obj)return;const v=clamp(+t.value||30,30,95);obj.attrs[k]=v;
    document.querySelectorAll(`[data-attr="${pre}"][data-k="${k}"]`).forEach(x=>{if(x!==t)x.value=v});const o=$("#"+pre+"_ovr");if(o)o.textContent=baseOf({pos:obj.pos,attrs:obj.attrs})}
  if(t.dataset.score){const sd=S.f["sd_"+t.dataset.m];if(sd)sd[t.dataset.score]=t.value===""?"":String(clamp(+t.value,0,60))}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="meSel"){S.me=t.value;LS.set("y_me",S.me);render(true);return}
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);if(["sort","wrapP","ap.pos","ed.pos","newDate"].includes(t.dataset.bind))render(true);return}
  if(t.dataset.score){render(true);return}
  if(t.dataset.vote){const k="v_"+t.dataset.m;(S.f[k]||(S.f[k]={}))[t.dataset.vote]=t.value;return}
  if(t.dataset.actChange==="cap"&&S.draft){S.draft["sel"+t.dataset.k]=t.value;render(true)}
  if(t.dataset.actChange==="bonus"){const sd=S.f["sd_"+t.dataset.m];if(sd){const o=sd.stats[t.dataset.p]||(sd.stats[t.dataset.p]={g:0,a:0,og:0,bonus:0});o.bonus=+t.value;render(true)}}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.actToggle)S.f[d.dataset.actToggle]=d.open},true);
document.addEventListener("focusout",()=>{setTimeout(()=>{if(S.pending&&!isEditing())render()},0)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal){S.modal=null;render(true)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
setInterval(()=>{if(document.visibilityState==="visible"&&!S.teams&&!S.draft)load()},25000);


/* Sahada sürükle-bırak */
let DRAG=null,SUPPRESS=false;
document.addEventListener("pointerdown",e=>{const tok=e.target.closest(".field.edit .tok");if(!tok||!S.teams)return;
  const f=tok.closest(".field").getBoundingClientRect();DRAG={tok,k:tok.dataset.k,i:+tok.dataset.i,sx:e.clientX,sy:e.clientY,f,moved:false,id:e.pointerId};});
document.addEventListener("pointermove",e=>{if(!DRAG||e.pointerId!==DRAG.id)return;const d=DRAG;
  if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<7)return;
  if(!d.moved){d.moved=true;d.tok.classList.add("dragging");try{d.tok.setPointerCapture(e.pointerId)}catch(_){}}
  e.preventDefault();const l=clamp((e.clientX-d.f.left)/d.f.width*100,4,96);let tp=clamp((e.clientY-d.f.top)/d.f.height*100,3,97);
  tp=d.k==="A"?clamp(tp,50,97):clamp(tp,3,50);d.tok.style.left=l+"%";d.tok.style.top=tp+"%";d.l=l;d.t=tp;},{passive:false});
function endDrag(e){if(!DRAG||(e&&e.pointerId!==DRAG.id))return;const d=DRAG;DRAG=null;if(!d.moved)return;SUPPRESS=true;setTimeout(()=>SUPPRESS=false,50);
  const t=S.teams;if(!t||d.l==null){render(true);return}const u=unpos2(d.k,d.l,d.t);const x=Math.round(clamp(u.x,4,96)),y=Math.round(clamp(u.y,2,100));
  const PS=t["p"+d.k.toLowerCase()];PS[d.i]=[x,y,roleFromY(d.i,y)];t.sel=null;render(true)}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",e=>{if(SUPPRESS){e.stopImmediatePropagation();e.preventDefault()}},true);
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.actToggleTeam&&S.teams)S.teams[d.dataset.actToggleTeam]=d.open},true);
/* Draft zamanlayıcı */
function startTimer(){stopTimer();S.tick=setInterval(()=>{const d=S.draft;if(!d||!d.deadline)return stopTimer();const left=Math.ceil((d.deadline-Date.now())/1000);const el=$("#dtimer");if(el)el.textContent=Math.max(0,left);
  if(left<=0){const m=S.matches.find(x=>x.id===d.mid);const pool=rsvpLists(m).kadro.map(p=>p.id).filter(id=>!d.A.includes(id)&&!d.B.includes(id)).sort((a,b)=>ovrOf(b)-ovrOf(a));if(pool[0]){toast("Süre doldu, en yüksek reytingli seçildi");dpick(pool[0])}}},250)}
function stopTimer(){clearInterval(S.tick);S.tick=null}
function dpick(id){const d=S.draft;if(!d)return;(d.turn==="A"?d.A:d.B).push(id);d.turn=d.turn==="A"?"B":"A";d.deadline=Date.now()+20000;
  const m=S.matches.find(x=>x.id===d.mid);if(!rsvpLists(m).kadro.some(p=>!d.A.includes(p.id)&&!d.B.includes(p.id)))stopTimer();render(true)}

render(true);
load().then(async()=>{if(S.pin){try{const r=await rpc("admin_check",{p_pin:S.pin});if(!r||!r.ok){S.admin=false;S.pin="";LS.del("y_pin");render(true)}}catch(_){}}});
})();
</script>
