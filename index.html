<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yelek</title>
<meta name="description" content="Halı saha ekibi için FIFA tarzı oyuncu kartları, 7'li dizilişler, maç sonu puanlama ve oylama.">
<meta name="theme-color" content="#0A1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yelek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Düzen: projektör altında gece maçı. Koyu çim zemin, turuncu yelek vurgusu. Telefona göre tek kolon (max 720px), alt menü, alttan açılan paneller. */
:root{
  --bg:#0A1510; --bg2:#0F1E17; --card:#13261D; --card2:#1A3127; --card3:#22402F;
  --line:rgba(226,240,230,.09); --line2:rgba(226,240,230,.18);
  --ink:#EEF5EF; --muted:#93AB9C; --dim:#6B8676;
  --turf:#2E9D5B; --turf2:#1C6B3D; --bib:#FF7A1A; --bib2:#FF9A4D; --gold:#F2C14E;
  --ok:#3DD07A; --bad:#FF5D52; --warn:#FFB23F; --info:#62AEFF;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --nav:66px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  background-image:radial-gradient(130% 55% at 50% -12%,rgba(46,157,91,.26),transparent 62%);background-attachment:fixed;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 20px)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bib);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:2.3rem;font-weight:900}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:.84rem}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Üst şerit */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(10,21,16,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand .t{min-width:0}
.brand b{display:block;font-family:var(--display);font-weight:900;font-size:1.55rem;letter-spacing:.06em;line-height:.9}
.brand small{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm{font-size:.62rem;font-weight:800;letter-spacing:.1em;background:var(--bib);color:#1A0E02;padding:3px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.meBtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;font-weight:700;font-size:.85rem;max-width:46%}
.meBtn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meBtn.ask{padding:8px 14px;background:var(--bib);color:#1A0E02;border-color:var(--bib)}

/* Alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(11,22,17,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:0 auto;height:var(--nav);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.nav .ic{display:grid;place-items:center;width:46px;height:28px;border-radius:99px;transition:background .2s}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--bib)}
.nav button[aria-current="page"] .ic{background:rgba(255,122,26,.16)}

main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 8px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.ph .muted{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--card2);padding:10px 16px;border-radius:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:transform .1s,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--bib);border-color:var(--bib);color:#1A0E02}
.btn.turf{background:var(--turf);border-color:var(--turf);color:#fff}
.btn.light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);background:none}
.btn.wa{background:#1F7A45;border-color:#25A85C;color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select{padding:11px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);min-width:0;width:100%;min-height:46px}
label.f{display:grid;gap:6px;font-size:.78rem;color:var(--muted);font-weight:700;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.info{color:var(--info)}.chip.muted{color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.note{font-size:.86rem;padding:12px 14px;border-radius:14px;background:var(--card2);color:var(--muted)}
.note b{color:var(--ink)}
.note.warn{background:rgba(255,178,63,.12);color:#FFD08A}
.empty{text-align:center;padding:26px 12px;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}
.bibdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--bib);margin-right:6px;vertical-align:1px}
.nobib{display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid #E8EFE9;margin-right:6px;vertical-align:1px}

/* Sıradaki maç */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;
  background:linear-gradient(155deg,#238A4E 0%,#145232 52%,#0E3322 100%);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px -22px rgba(46,157,91,.7)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 30px,transparent 30px 60px);pointer-events:none}
.hero::after{content:"";position:absolute;width:190px;height:190px;border:2px solid rgba(255,255,255,.13);border-radius:50%;right:-70px;top:-60px;pointer-events:none}
.hero>*{position:relative}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cd{font-size:.74rem;font-weight:800;background:rgba(0,0,0,.28);padding:5px 10px;border-radius:99px;letter-spacing:.02em}
.hero-main{display:flex;justify-content:space-between;align-items:center;gap:12px}
.vs{display:grid;gap:2px}
.vt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.vn{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,7.6vw,2.8rem);line-height:1;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vt.a .vn{color:var(--bib2)}
.va{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.7);white-space:nowrap;flex:none}.va b{font-family:var(--display);font-size:1.5rem;color:#fff;margin-left:4px}
.vx{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:.9rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em}
.vx::before,.vx::after{content:"";height:1px;flex:1;background:rgba(255,255,255,.18)}
.vmeta{display:flex;gap:6px;align-items:center;font-size:.88rem;font-weight:600;color:rgba(255,255,255,.88);line-height:1.35;min-width:0}
.vmeta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vmeta svg{width:16px;height:16px;flex:none}.vmeta b{color:#fff}
.when{display:grid;line-height:.9;min-width:0;flex:1}
.when .wd{font-family:var(--display);font-weight:900;font-size:clamp(2rem,9vw,3.4rem);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:clip}
.when .dt{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,7vw,1.9rem);color:var(--bib2);text-transform:uppercase}
.when .tm{margin-top:10px;font-size:.88rem;font-weight:600;color:rgba(255,255,255,.85);line-height:1.3;display:flex;gap:6px;align-items:center}
.when .tm svg{width:16px;height:16px;flex:none}
.clk{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 16px}
.clk[hidden]{display:none}
.clk .eyebrow{color:rgba(255,255,255,.8)}
.clk b{font-family:var(--display);font-weight:900;font-size:clamp(2rem,10vw,2.6rem);line-height:1;letter-spacing:.02em;color:#fff}
.clk.live b{font-size:1.3rem;color:#3DD07A}
.rsvpBig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.22);color:#fff;border-radius:16px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:.82rem;transition:transform .12s,background .2s}
.rb svg{width:22px;height:22px}
.rb:active{transform:scale(.96)}
.rb.g.on{background:#3DD07A;border-color:#3DD07A;color:#062512}
.rb.y.on{background:#FFB23F;border-color:#FFB23F;color:#2B1A00}
.rb.n.on{background:#FF5D52;border-color:#FF5D52;color:#2B0503}
.hero-note{font-size:.86rem;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Oyuncu satırları */
.list{display:grid}
.grp{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:12px 0 4px}
.pl{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.pl:last-child{border-bottom:0}
.pl .pi{flex:1;min-width:0;display:grid;gap:2px}
.pl .pi b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pi>span{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-family:var(--display);font-weight:900;font-size:1.05rem;flex:none;color:#241900;background:linear-gradient(150deg,#ECEFF1,#A4ADB3)}
.av.gold{background:linear-gradient(150deg,#F6DE8F,#C8962C)}
.av.bronze{background:linear-gradient(150deg,#E8BF96,#A46A3E);color:#2A1608}
.av.star{background:linear-gradient(150deg,#2B9B58,#0B2F1B);color:#F6DE8F}
.av.sm{width:30px;height:30px;font-size:.85rem}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%}
.av.hasph{padding:2px}
.tok .shirt img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%}
.tok .shirt.hasph{padding:2.5px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.phrow{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:10px 12px}
.phrow .av{width:52px;height:52px}
.phrow .av svg{width:70%;color:rgba(0,0,0,.45)}
.avw{position:relative;flex:none;display:block}
.avw .ab{position:absolute;right:-5px;bottom:-4px;font-family:var(--display);font-weight:900;font-size:.72rem;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:0 4px;line-height:1.35}
.avbtn{border:0;background:none;padding:0;flex:none}
.ms{display:inline-flex;gap:4px;flex:none}
.ms button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--muted);display:grid;place-items:center;padding:0}
.ms svg{width:17px;height:17px}
.ms button.on.g{background:var(--ok);border-color:var(--ok);color:#062512}
.ms button.on.y{background:var(--warn);border-color:var(--warn);color:#2B1A00}
.ms button.on.n{background:var(--bad);border-color:var(--bad);color:#2B0503}

/* Takım kurma seçenekleri */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.act{border:1px solid var(--line2);background:var(--card2);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;transition:transform .12s,border-color .2s}
.act:active{transform:scale(.98)}
.act:hover{border-color:var(--bib)}
.act svg{width:26px;height:26px;color:var(--bib);margin-bottom:4px}
.act b{font-size:.98rem}
.act span{font-size:.78rem;color:var(--muted)}
.act:disabled{opacity:.4}

/* Takımlar ve saha */
.cmp{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:1.35rem}
.cmp .bar2{flex:1;height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--card2)}
.cmp .bar2 i{display:block;height:100%}
.lineup{display:grid;gap:16px;align-items:start}
@media (min-width:700px){.lineup{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.field{position:relative;width:100%;max-width:460px;margin:0 auto;aspect-ratio:68/100;border-radius:18px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#1F7E46 0 8.33%,#1A6F3D 8.33% 16.66%);box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.field svg.lines{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;max-width:24%;transition:left .25s,top .25s}
.field.both .tok{max-width:21%;gap:2px}
.tok .shirt{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.2rem;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.field.both .tok .shirt{width:30px;height:30px;font-size:.95rem}
.tok .cap{position:absolute;left:-7px;bottom:-5px;width:16px;height:16px;border-radius:50%;background:#FFE066;color:#1A1300;font-style:normal;font-family:var(--display);font-size:.66rem;font-weight:900;display:grid;place-items:center;border:1px solid rgba(0,0,0,.35);line-height:1;letter-spacing:0}
.field.both .tok .cap{width:14px;height:14px;font-size:.58rem;left:-6px;bottom:-4px}
.capi{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#FFE066;color:#1A1300;font-family:var(--display);font-weight:900;font-size:.62rem;vertical-align:-2px;margin-right:4px}
.tok .shirt.p3{font-size:.95rem;letter-spacing:-.02em}.field.both .tok .shirt.p3{font-size:.74rem}
.tok.a .shirt{background:#FF7A1A;color:#1A0E02}
.tok.b .shirt{background:#F3F6F2;color:#13261B}
.tok .ov{position:absolute;right:-9px;top:-7px;font-style:normal;font-family:var(--display);font-weight:900;font-size:.7rem;background:#0A1510;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:0 3px;line-height:1.35}
.field.both .tok .ov{font-size:.62rem;right:-8px;top:-6px}
.tok .tn{font-size:.7rem;font-weight:700;background:rgba(5,15,10,.74);padding:1px 7px;border-radius:6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.field.both .tok .tn{font-size:.6rem;padding:0 5px;line-height:1.35}
.tok.empty .shirt{background:rgba(0,0,0,.15);border:2px dashed rgba(255,255,255,.7);color:#fff;font-size:.75rem;box-shadow:none}
.tok.empty .tn{background:none;opacity:.8}
.tok.sel .shirt{outline:3px solid #FFE066;outline-offset:3px}
.tok.gk .shirt{box-shadow:0 0 0 3px #FFE066,0 4px 10px rgba(0,0,0,.35)}
.field.edit{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.field.edit .tok{touch-action:none;cursor:grab}
.field.edit .tok.dragging{cursor:grabbing;z-index:5;transition:none}
.field.edit .tok.dragging .shirt{transform:scale(1.15)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--bg2);border:1px solid var(--line2);border-radius:13px;padding:3px;gap:3px}
.seg3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg3 button{border:0;background:none;border-radius:10px;min-height:40px;font-weight:700;font-size:.82rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap;overflow:hidden;padding:0 6px}
.seg3 button.on{background:var(--card3);color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:440px){.legend{grid-template-columns:minmax(0,1fr)}}
.lg{background:var(--card2);border-radius:14px;padding:10px 12px;display:grid;gap:4px;min-width:0}
.lgh{display:flex;align-items:center;gap:8px;min-width:0}
.lgh b{font-family:var(--display);font-weight:800;font-size:1.05rem;text-transform:uppercase;white-space:nowrap}
.lgh .avg{margin-left:auto;font-family:var(--display);font-weight:900;font-size:1.4rem}
.str{display:grid;gap:10px;background:var(--card2);border-radius:14px;padding:12px}
.str .eyebrow{text-align:center}
.sr{display:grid;grid-template-columns:2.1em minmax(0,1fr) 5.4em minmax(0,1fr) 2.1em;align-items:center;gap:8px}
.sr b{font-family:var(--display);font-weight:900;font-size:1.15rem;color:var(--muted)}
.sr b.hi{color:var(--ink)}
.sr b:last-child{text-align:right}
.sr .lbl{text-align:center;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sr .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden;display:flex}
.sr .bar.l{justify-content:flex-end}
.sr .bar i{display:block;height:100%;border-radius:99px}
.sr .bar.l i{background:var(--bib)}.sr .bar.r i{background:#E8EFE9}
.side{display:grid;gap:6px}
.subp{display:grid;gap:12px;color:var(--ink);border:1px solid var(--bib)}
.subg{display:grid;gap:6px}

.lhd .trend{margin-left:auto;font-size:.72rem;font-weight:800;flex:none}
.trend.up{color:var(--ok)}.trend.down{color:var(--bad)}
.lst{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:6px;text-align:center}

.v8{color:#3DD07A!important}.v7{color:#A9DE5C!important}.v6{color:#F2C14E!important}.v5{color:#FF9A4A!important}

.rank li{cursor:pointer}
.rank .mv{font-size:.7rem;font-weight:800;min-width:2.4em;text-align:right;color:var(--dim)}

.rank .rv2{display:flex;align-items:center;gap:8px;flex:none}
.rank .rv2 b{font-family:var(--display);font-size:1.15rem}
.board li>span:first-child{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board ol{grid-template-columns:minmax(0,1fr)}
.fut{--c1:#E8EBEE;--c2:#AEB5BA;--tx:#1B2328;position:relative;border:0;padding:0;background:none;width:100%;max-width:220px;justify-self:center;aspect-ratio:3/4.3;text-align:left;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.fut .face{position:absolute;inset:0;overflow:hidden;clip-path:polygon(14% 0,86% 0,100% 7%,100% 88%,50% 100%,0 88%,0 7%);
  background:radial-gradient(120% 70% at 30% 0%,rgba(255,255,255,.55),transparent 55%),linear-gradient(160deg,var(--c1),var(--c2));color:var(--tx);padding:12% 10% 0;display:flex;flex-direction:column}
.fut .face::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-110%);pointer-events:none}
.fut.gold,.lth.gold{--c1:#F6DE8F;--c2:#C8962C;--tx:#2A1D04}
.fut.silver,.lth.silver{--c1:#ECEFF1;--c2:#A4ADB3;--tx:#1A2227}
.fut.bronze,.lth.bronze{--c1:#E8BF96;--c2:#A46A3E;--tx:#2A1608}
.fut.star,.lth.star{--c1:#1F7A43;--c2:#0B2F1B;--tx:#F6DE8F}
.fut .tl{display:flex;flex-direction:column;align-items:center;width:30%;line-height:.9;position:relative;z-index:1}
.fut .ovr{font-family:var(--display);font-weight:900;font-size:2.2rem}

.fut .ps{font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:.04em}
.fut .trend{font-size:.72rem;font-weight:800;margin-top:3px}
.fut .pic{position:absolute;right:6%;top:6%;width:64%;height:48%;display:grid;place-items:end center;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}

.fut .at{display:grid;grid-template-columns:1fr 1fr;column-gap:8%;row-gap:1px;font-size:.66rem;font-weight:800;letter-spacing:.03em;padding:4px 6% 19%;font-variant-numeric:tabular-nums;position:relative;z-index:1}

.fut.out .face{filter:grayscale(.65) brightness(.85)}
.fut.big{max-width:230px;width:min(230px,66vw);flex:none}
.up{color:#14803C}.down{color:#B42318}
.fut.star .up{color:#7CE3A1}.fut.star .down{color:#FF9C92}
@media (prefers-reduced-motion:no-preference){

  .fut.big .face::after{animation:shine 1.1s .25s both}
  @keyframes shine{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
}

/* Alttan açılan panel */

.kv div{background:var(--card2);border-radius:12px;padding:8px 10px}

.badges{display:flex;flex-wrap:wrap;gap:8px}

.badge i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--gold);color:#241900;font-family:var(--display);font-weight:900}

.statuses{display:flex;flex-wrap:wrap;gap:6px}

.statuses button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.attrs-grp{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

.slide{scroll-snap-align:start;border-radius:20px;padding:20px;min-height:250px;display:flex;flex-direction:column;justify-content:space-between;color:#F4F8F3;background:linear-gradient(160deg,#1E7A43,#0B2F1B)}

function gkCounts(){const c={};for(const m of S.matches){const a=(m.lineup_a||[])[0],b=(m.lineup_b||[])[0];if(a)c[a]=(c[a]||0)+1;if(b)c[b]=(c[b]||0)+1}return c}
function pickGk(ids){const kl=ids.filter(id=>posOf(P(id))==="KL");if(kl.length)return kl.sort((a,b)=>ovrOf(b)-ovrOf(a))[0];const c=gkCounts();
  return [...ids].sort((a,b)=>(c[a]||0)-(c[b]||0)||ovrOf(a)-ovrOf(b))[0]||null}
function balanceIds(ids){
  const n=ids.length,half=Math.floor(n/2);if(half<1)return{A:ids,B:[]};
  const ov=Object.fromEntries(ids.map(id=>[id,ovrOf(id)]));const kl=ids.filter(id=>posOf(P(id))==="KL");const res=[];const first=ids[0],rest=ids.slice(1);
  const cnt=(T,r)=>T.filter(x=>posOf(P(x))===r).length;
  const rec=(start,pick)=>{
    if(pick.length===half-1){const Ta=[first,...pick];const Tb=ids.filter(x=>!Ta.includes(x));
      const sa=Ta.reduce((s,x)=>s+ov[x],0)/Ta.length,sb=Tb.reduce((s,x)=>s+ov[x],0)/Tb.length;let sc=Math.abs(sa-sb);
      if(kl.length>=2&&(kl.every(k=>Ta.includes(k))||kl.every(k=>Tb.includes(k))))sc+=50;
      for(const r of["DF","OS","FV"])sc+=Math.max(0,Math.abs(cnt(Ta,r)-cnt(Tb,r))-1)*.6;res.push([sc,Ta,Tb]);return}
    for(let i=start;i<rest.length;i++){pick.push(rest[i]);rec(i+1,pick);pick.pop();if(res.length>60000)return}};
  rec(0,[]);res.sort((a,b)=>a[0]-b[0]);const best=res[0][0];const near=res.filter(r=>r[0]<=best+.4).slice(0,40);const pk=near[Math.floor(Math.random()*near.length)];
  return Math.random()<.5?{A:pk[1],B:pk[2]}:{A:pk[2],B:pk[1]};
}
function autoLineup(ids,fk){
  const slots=FORMS[fk].slots;const out=new Array(slots.length).fill(null);let pool=[...ids];
  const gk=pickGk(pool);if(gk){out[0]=gk;pool=pool.filter(x=>x!==gk)}
  const byO=arr=>arr.sort((a,b)=>ovrOf(b)-ovrOf(a));
  for(let i=1;i<slots.length;i++){const c=byO(pool.filter(id=>posOf(P(id))===slots[i][2]))[0];if(c){out[i]=c;pool=pool.filter(x=>x!==c)}}
  const near={DF:["OS","FV","KL"],OS:["DF","FV","KL"],FV:["OS","DF","KL"]};
  for(let i=1;i<slots.length;i++){if(out[i])continue;let c=null;for(const r of near[slots[i][2]]){c=byO(pool.filter(id=>posOf(P(id))===r))[0];if(c)break}
    if(!c)c=byO(pool)[0];if(c){out[i]=c;pool=pool.filter(x=>x!==c)}}
  return out;
}
const sumAvg=ids=>ids.length?Math.round(ids.reduce((s,x)=>s+ovrOf(x),0)/ids.length):0;

    for(let i=k;i<6;i++){[a[k],a[i]]=[a[i],a[k]];go(k+1);[a[k],a[i]]=[a[i],a[k]]}};

function layout(mode,pa,pb,la,lb){

  const add=(k,PS,L)=>PS.forEach(([x,y,r],i)=>{let l,t;if(mode==="both"){({l,t}=pos2(k,x,y))}else{l=x;t=95-y*.88}toks.push({k,i,id:L[i],r:i===0?"KL":r,ep:i===0?"KL":slotPos(x,y,r),l,t})});

function spiker(m,inf){
  const r=hash(m.id);const pick=arr=>arr[r%arr.length];const sa=+m.score_a||0,sb=+m.score_b||0;const stt=m.stats||{};
  const W=sa>sb?"A":sb>sa?"B":null;const Lz=W==="A"?"B":"A";const diff=Math.abs(sa-sb);
  const pl=[...(m.team_a||[]),...(m.team_b||[])];
  const top=pl.filter(id=>+stt[id]?.g).sort((a,b)=>(+stt[b].g)-(+stt[a].g))[0];const tg=top?+stt[top].g:0;
  const ast=pl.filter(id=>+stt[id]?.a).sort((a,b)=>(+stt[b].a)-(+stt[a].a))[0];const N=id=>nameOf(id);
  let head;
  if(tg>=3)head=pick([`${up(N(top))} GECEYE DAMGA VURDU`,`${up(N(top))} DURDURULAMADI: ${tg} GOL`,`HAT-TRICK ALARMI: ${up(N(top))}`]);
  else if(!W)head=pick([`DOSTLAR ALIŞVERİŞTE GÖRSÜN: ${sa}-${sb}`,`KAZANAN YOK, KONUŞAN ÇOK`,`NEFES KESEN BERABERLİK`]);
  else if(diff>=5)head=pick([`${up(TEAM[W])} SAHAYI DÜMDÜZ ETTİ`,`${up(TEAM[Lz])} İÇİN KARA GECE`,`FARK ${diff}: ${up(TEAM[W])} ACIMADI`]);
  else if(diff===1)head=pick([`TEK FARK, BÜYÜK SEVİNÇ`,`${up(TEAM[W])} SON SÖZÜ SÖYLEDİ`,`NEFESLER TUTULDU, ${up(TEAM[W])} GÜLDÜ`]);
  else head=pick([`${up(TEAM[W])} GÜLEN TARAF OLDU`,`${up(TEAM[W])} İŞİNİ BİLDİ`,`ZAFER: ${up(TEAM[W])}`]);
  const fld=S.settings.field_name?S.settings.field_name+" sahasında":"sahada";
  let body=`${fmtDate(m.date)} akşamı ${fld} oynanan karşılaşma ${W?`${TEAM[W]} takımının ${Math.max(sa,sb)}-${Math.min(sa,sb)} galibiyetiyle`:`${sa}-${sb} beraberlikle`} sona erdi. `;
  if(top)body+=tg>=3?`Gecenin yıldızı ${tg} golle ${N(top)} oldu; rakip savunma bu ismi uzun süre unutmayacak. `:`Gol yollarında en etkili isim ${tg} golle ${N(top)} oldu. `;
  if(ast)body+=`${N(ast)} ${+stt[ast].a} asistle oyunun beyni görevini üstlendi. `;
  for(const k of["A","B"]){const gk=lineupOf(m,k)[0];const conc=k==="A"?sb:sa;if(gk){if(conc===0)body+=`${N(gk)} kalesini gole kapattı, tribünler ayakta. `;else if(conc>=8)body+=`${N(gk)} için zor bir geceydi: kalesinde ${conc} gol gördü. `}}
  if(inf.motm)body+=`Maçın Adamı ödülünü ${N(inf.motm)} aldı. `;
  if(inf.fiy)body+=`Haftanın Fiyaskosu ise ${N(inf.fiy)}; soyunma odasında bu konu daha çok konuşulur.`;
  return `<span class="eyebrow">Spiker</span><strong>${esc(head)}</strong>${esc(body.trim())}`;
}

function spark(arr){if(arr.length<2)return"";const W=220,H=46,mn=Math.min(...arr)-1,mx=Math.max(...arr)+1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*(W-8)+4,H-4-(v-mn)/(mx-mn)*(H-8)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const l=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Reyting değişimi"><path d="${d} L${l[0]} ${H} L4 ${H}Z" fill="#2E9D5B" opacity=".18"/><path d="${d}" fill="none" stroke="#3DD07A" stroke-width="2"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="#FF7A1A"/></svg>`}

/* ================= Sezon ================= */
function viewSezon(){
  const yr=new Date().getFullYear();const F=fin().filter(m=>parseYmd(m.date).getFullYear()===yr);
  const ys={};for(const p of S.all)ys[p.id]={g:0,a:0,motm:0,fiy:0,games:0,pts:0,W:0,D:0,L:0,totw:0,klG:0,klC:0,hat:0,best:0};
  for(const m of F){const inf=S.mInfo[m.id];for(const[id,r]of Object.entries(inf.pts)){const y=ys[id];if(!y||!r)continue;y.games++;y.g+=r.g;y.a+=r.a;y.pts+=r.pts;
      if(r.res==="G")y.W++;else if(r.res==="B")y.D++;else y.L++;if(r.g>=3)y.hat++;if(r.pts>y.best)y.best=r.pts;if(r.role==="KL"){y.klG++;y.klC+=r.op}}
    for(const id of inf.totw)if(ys[id])ys[id].totw++;
    if(inf.motm&&ys[inf.motm])ys[inf.motm].motm++;if(inf.fiy&&ys[inf.fiy])ys[inf.fiy].fiy++}
  const yrStart=new Date(yr,0,1).getTime();
  for(const p of S.players){const s=S.stats[p.id];if(!s)continue;const before=(s.hist||[]).filter(x=>matchTs(x.m)<yrStart);ys[p.id].dOvr=s.ovr-(before.length?before[before.length-1].ovr:s.base)}
  const board=(t,val,fmt,filt,asc)=>{const l=S.players.filter(p=>filt?filt(ys[p.id]):val(ys[p.id])>0).sort((a,b)=>asc?val(ys[a.id])-val(ys[b.id]):val(ys[b.id])-val(ys[a.id])).slice(0,5);
    if(!l.length)return"";return `<section class="card board"><h3>${t}</h3>${l.length?`<ol>${l.map((p,i)=>`<li data-act="open" data-id="${esc(p.id)}"><span><span class="rk">${i+1}</span>${esc(p.name)}</span><b>${fmt(ys[p.id])}</b></li>`).join("")}</ol>`:'<p class="muted small">Henüz veri yok.</p>'}</section>`};
  const prevO=id=>{const se=S.stats[id]?.series||[];return se.length>1?se[se.length-2]:ovrOf(id)};
  const rk=[...S.players].sort((a,b)=>ovrOf(b.id)-ovrOf(a.id)||a.name.localeCompare(b.name,"tr"));
  const prk=[...S.players].sort((a,b)=>prevO(b.id)-prevO(a.id)||a.name.localeCompare(b.name,"tr")).map(p=>p.id);
  const rkRows=(S.f.rkAll?rk:rk.slice(0,10)).map((p,i)=>{const mv=fin().length>1?prk.indexOf(p.id)-i:0;const d=S.stats[p.id]?.lastD||0;
    return `<li data-act="open" data-id="${esc(p.id)}"><span><span class="rk">${i+1}</span>${esc(p.name)} <span class="pchip" style="margin-left:4px">${eposOf(p)}</span></span><span class="rv2"><span class="mv ${mv>0?"up":mv<0?"down":""}">${mv>0?"▲"+mv:mv<0?"▼"+(-mv):"–"}</span><b class="num ${vcls(ovrOf(p.id))}">${ovrOf(p.id)}</b><span class="delta ${d>0?"pos":d<0?"neg":"zero"}" style="min-width:2em;text-align:right">${d>0?"+"+d:d}</span></span></li>`}).join("");
  const rkCard=`<section class="card board rank"><div class="ch"><div><h3>Reyting sıralaması</h3><p class="muted small" style="margin-top:4px">Her maçtan sonra güncellenir. Ok, geçen haftaya göre sıra değişimi; sağdaki sayı son maçtaki reyting değişimi.</p></div></div><ol>${rkRows}</ol>${rk.length>10?`<button class="btn sm ghost" data-act="rkAll">${S.f.rkAll?"Daha az göster":"Tümünü göster ("+rk.length+")"}</button>`:""}</section>`;
  let h=`<div class="ph"><div><h1>Sezon ${yr}</h1><span class="muted">${F.length} maç oynandı</span></div></div>`;
  if(!F.length)h+=`<section class="card"><div class="empty"><h3>Sezon yeni başlıyor</h3><p>İlk maç bitip istatistikler girilince krallık tabloları burada dolacak.</p></div></section>`;
  if(S.players.length)h+=rkCard;
  if(F.length)h+=`<div class="boards">${board("Gol krallığı",x=>x.g,x=>x.g)}${board("Asist krallığı",x=>x.a,x=>x.a)}${board("Maçın Adamı",x=>x.motm,x=>x.motm+" kez")}${board("Gol + asist",x=>x.g+x.a,x=>x.g+x.a)}
    ${board("En çok galibiyet",x=>x.W,x=>x.W+" G")}${board("Kazanma yüzdesi",x=>x.W/x.games,x=>"%"+Math.round(x.W/x.games*100),x=>x.games>=3)}${board("Puan ortalaması",x=>x.pts/x.games,x=>(x.pts/x.games).toFixed(1),x=>x.games>=3)}${board("Haftanın Takımı",x=>x.totw,x=>x.totw+" kez")}
    ${board("Yılın yükselenleri",x=>x.dOvr||0,x=>"+"+x.dOvr)}${board("Kalede en az gol yiyen",x=>x.klC/x.klG,x=>(x.klC/x.klG).toFixed(1)+" / maç",x=>x.klG>=2,true)}${board("Tek maçta en yüksek puan",x=>x.best,x=>x.best)}${board("Demir adamlar",x=>x.games,x=>x.games+" maç")}${board("Fiyasko listesi",x=>x.fiy,x=>x.fiy+" kez")}</div>`;
  const wp=P(S.f.wrapP||S.me);
  h+=`<section class="card"><div class="ch"><div><div class="eyebrow">Yıl özeti</div><h2>${wp?esc(firstName(wp.name))+" · "+yr:"Bir oyuncu seç"}</h2></div>
    <select id="wrapSel" data-bind="wrapP" aria-label="Oyuncu" style="width:auto"><option value="">Seç</option>${S.players.map(p=>`<option value="${esc(p.id)}"${wp&&wp.id===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select></div>`;
  if(wp){const y=ys[wp.id]||{};const s=S.stats[wp.id]||{};const bm=s.bestM&&parseYmd(s.bestM.date).getFullYear()===yr?s.bestM:null;const diff=(s.ovr||0)-(s.base||0);
    h+=`<div class="wrapped"><div class="slide"><span class="lb">Bu yıl sahaya çıktın</span><span class="big num">${y.games||0}</span><span>maç. ${s.best>=4?"En uzun serin "+s.best+" maç üst üste.":"Seneye daha sık bekliyoruz."}</span></div>
      <div class="slide"><span class="lb">Gol + asist</span><span class="big num">${(y.g||0)+(y.a||0)}</span><span>${y.g||0} gol, ${y.a||0} asist.</span></div>
      <div class="slide"><span class="lb">En iyi maçın</span><span class="big num">${bm?bm.pts:"–"}</span><span>${bm?fmtDate(bm.date)+" maçında aldığın puan.":"Henüz puanlı maç yok."}</span></div>
      <div class="slide"><span class="lb">Kartın şimdi</span><span class="big num">${s.ovr||"–"}</span><span>Başlangıçtan ${diff>0?"+"+diff:diff} puan.${y.motm?" "+y.motm+" kez Maçın Adamı seçildin.":""}</span></div>
      <div class="slide"><span class="lb">Rozetler</span><span class="big num">${(s.badges||[]).filter(b=>!b.shame).length}</span><span>${(s.badges||[]).map(b=>esc(b.t)).join(", ")||"Daha rozet yok."}</span></div></div>`}
  h+=`</section>`;
  return h;
}

function tapSlot(k,i){const t=S.teams;const L=t["l"+k.toLowerCase()];const s=t.sel;
  if(!s){t.sel={kind:"slot",team:k,idx:i};return}
  if(s.team!==k){t.sel={kind:"slot",team:k,idx:i};return}
  if(s.kind==="slot"){if(s.idx!==i){const a1=L[s.idx],b1=L[i];[L[s.idx],L[i]]=[L[i],L[s.idx]];if(a1&&b1)toast(`${shortName(nameOf(a1))} ⇄ ${shortName(nameOf(b1))}`)}t.sel=null;return}
  L[i]=s.pid;t.sel=null}
function tapBench(k,pid){const t=S.teams;const s=t.sel;
  if(s&&s.kind==="slot"&&s.team===k){t["l"+k.toLowerCase()][s.idx]=pid;t.sel=null;return}
  t.sel=(s&&s.kind==="bench"&&s.pid===pid)?null:{kind:"bench",team:k,pid}}
async function photoData(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("img"));i.src=url});
    const W=320,H=400,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
    const r=Math.max(W/img.naturalWidth,H/img.naturalHeight),w=img.naturalWidth*r,h=img.naturalHeight*r;
    x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(img,(W-w)/2,Math.min(0,(H-h)*.3),w,h);
    let q=.85,d=c.toDataURL("image/jpeg",q);while(d.length>150000&&q>.4){q-=.1;d=c.toDataURL("image/jpeg",q)}return d}
  finally{URL.revokeObjectURL(url)}
}

}

function endDrag(e){if(!DRAG||(e&&e.pointerId!==DRAG.id))return;const d=DRAG;DRAG=null;if(!d.moved)return;SUPPRESS=true;setTimeout(()=>SUPPRESS=false,50);
  const t=S.teams;if(!t||d.l==null){render(true);return}
  const u=d.mode==="both"?unpos2(d.k,d.l,d.t):{x:d.l,y:(95-d.t)/.88};const x=Math.round(clamp(u.x,4,96)),y=Math.round(clamp(u.y,2,100));
  t["p"+d.k.toLowerCase()][d.i]=[x,y,roleFromY(d.i,y)];t.sel=null;render(true)}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",e=>{if(SUPPRESS){e.stopImmediatePropagation();e.preventDefault()}},true);

/* Dizilişi görsel olarak paylaş */
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
async function shareImg(m){
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,800))])}catch(_){}
  const W=1080,H=1580,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const D='"Big Shoulders Display","Arial Narrow",sans-serif',F='Figtree,system-ui,sans-serif';
  x.fillStyle="#0A1510";x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W/2,-160,40,W/2,-160,1000);g.addColorStop(0,"rgba(46,157,91,.5)");g.addColorStop(1,"rgba(46,157,91,0)");x.fillStyle=g;x.fillRect(0,0,W,900);
  x.textBaseline="alphabetic";x.textAlign="left";
  x.fillStyle="#FF7A1A";x.font=`900 38px ${D}`;x.fillText("YELEK",60,78);
  x.fillStyle="#EEF5EF";x.font=`900 74px ${D}`;x.fillText(up(S.settings.group_name),60,152);
  x.fillStyle="#93AB9C";x.font=`600 30px ${F}`;x.fillText(`${fmtDate(m.date)} · ${m.time||""}${S.settings.field_name?" · "+S.settings.field_name:""}`,60,198);
  const px=60,py=238,pw=960,ph=1130;
  x.save();rr(x,px,py,pw,ph,36);x.clip();
  for(let i=0;i<12;i++){x.fillStyle=i%2?"#1A6F3D":"#1F7E46";x.fillRect(px,py+i*ph/12,pw,ph/12+1)}
  const sx=pw/68,sy=ph/100,L=(a,b)=>[px+a*sx,py+b*sy];
  x.strokeStyle="rgba(255,255,255,.55)";x.lineWidth=4;
  const rect=(a,b,w,h)=>{const[X,Y]=L(a,b);x.strokeRect(X,Y,w*sx,h*sy)};
  rect(3,3,62,94);rect(17,3,34,13);rect(26,3,16,5);rect(17,84,34,13);rect(26,92,16,5);
  x.beginPath();x.moveTo(...L(3,50));x.lineTo(...L(65,50));x.stroke();
  x.beginPath();x.ellipse(px+34*sx,py+50*sy,7*sx,7*sx,0,0,Math.PI*2);x.stroke();
  x.restore();
  const A=m.team_a||[],B=m.team_b||[],pa=posArr(m,"A"),pb=posArr(m,"B"),la=pad7(lineupOf(m,"A"),A),lb=pad7(lineupOf(m,"B"),B);
  for(const T of layout("both",pa,pb,la,lb)){if(!T.id)continue;const cx=px+T.l/100*pw,cy=py+T.t/100*ph-10;
    x.beginPath();x.arc(cx,cy,33,0,Math.PI*2);x.fillStyle=T.k==="A"?"#FF7A1A":"#F3F6F2";x.shadowColor="rgba(0,0,0,.4)";x.shadowBlur=14;x.fill();x.shadowBlur=0;
    if(T.i===0){x.lineWidth=7;x.strokeStyle="#FFE066";x.stroke()}
    x.fillStyle=T.k==="A"?"#1A0E02":"#13261B";x.font=`900 34px ${D}`;x.textAlign="center";x.textBaseline="middle";x.font=`900 ${T.ep.length>2?26:32}px ${D}`;x.fillText(T.ep,cx,cy+2);
    if((T.k==="A"?m.cap_a:m.cap_b)===T.id){x.beginPath();x.arc(cx-26,cy+24,15,0,Math.PI*2);x.fillStyle="#FFE066";x.fill();x.lineWidth=2;x.strokeStyle="rgba(0,0,0,.35)";x.stroke();x.fillStyle="#1A1300";x.font=`900 18px ${D}`;x.fillText("C",cx-26,cy+25)}
    const ov=String(ovrOf(T.id));x.font=`900 24px ${D}`;const ow=x.measureText(ov).width+12;rr(x,cx+16,cy-42,ow,28,8);x.fillStyle="#0A1510";x.fill();x.lineWidth=2;x.strokeStyle="rgba(255,255,255,.5)";x.stroke();x.fillStyle="#fff";x.fillText(ov,cx+16+ow/2,cy-27);
    const nm=shortName(nameOf(T.id));x.font=`700 26px ${F}`;const nw=Math.min(200,x.measureText(nm).width+20);rr(x,cx-nw/2,cy+40,nw,34,10);x.fillStyle="rgba(5,15,10,.8)";x.fill();x.fillStyle="#fff";x.fillText(nm,cx,cy+58,180)}
  x.textBaseline="alphabetic";
  const leg=(k,X,ids,fk,ps)=>{x.textAlign="left";x.fillStyle=k==="A"?"#FF7A1A":"#F3F6F2";rr(x,X,1410,26,26,6);x.fill();
    x.fillStyle="#EEF5EF";x.font=`900 40px ${D}`;x.fillText(up(TEAM[k]),X+40,1434);
    x.fillStyle="#93AB9C";x.font=`600 28px ${F}`;x.fillText(`${formText(fk,ps)} · ortalama ${sumAvg(ids)}`,X,1484)};
  leg("A",60,A,formOf(m,"A"),pa);leg("B",560,B,formOf(m,"B"),pb);
  x.fillStyle="#6B8676";x.font=`600 24px ${F}`;x.textAlign="right";x.fillText(location.host+location.pathname,W-60,H-36);
  c.toBlob(async blob=>{if(!blob){toast("Görsel oluşturulamadı");return}
    const file=new File([blob],"yelek-kadro.png",{type:"image/png"});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Kadrolar"});return}}catch(err){if(err&&err.name==="AbortError")return}
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="yelek-kadro.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast("Görsel indirildi")},"image/png");
}

/* Draft zamanlayıcı */
function startTimer(){stopTimer();S.tick=setInterval(()=>{const d=S.draft;if(!d||!d.deadline)return stopTimer();const left=Math.ceil((d.deadline-Date.now())/1000);const el=$("#dtimer");if(el)el.textContent=Math.max(0,left);
  if(left<=0){const m=S.matches.find(x=>x.id===d.mid);const pool=rsvpLists(m).kadro.map(p=>p.id).filter(id=>!d.A.includes(id)&&!d.B.includes(id)).sort((a,b)=>ovrOf(b)-ovrOf(a));if(pool[0]){toast("Süre doldu, en yüksek reytingli seçildi");dpick(pool[0])}}},250)}
function stopTimer(){clearInterval(S.tick);S.tick=null}
function dpick(id){const d=S.draft;if(!d)return;(d.turn==="A"?d.A:d.B).push(id);d.turn=d.turn==="A"?"B":"A";d.deadline=Date.now()+20000;
  const m=S.matches.find(x=>x.id===d.mid);if(!rsvpLists(m).kadro.some(p=>!d.A.includes(p.id)&&!d.B.includes(p.id)))stopTimer();render(true)}

render(true);

  if(S.loaded&&!S.me&&S.players.length&&!LS.get("y_asked")){LS.set("y_asked","1");S.sheet={type:"me"};render(true)}
  if(S.pin){try{const r=await rpc("admin_check",{p_pin:S.pin});if(!r||!r.ok){S.admin=false;S.pin="";LS.del("y_pin");render(true)}}catch(_){}}
});
})();
