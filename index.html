<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yelek</title>
<meta name="description" content="Halı saha ekibi için FIFA tarzı oyuncu kartları, 7'li dizilişler, maç sonu puanlama ve oylama.">
<meta name="theme-color" content="#0A1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yelek">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Düzen: projektör altında gece maçı. Koyu çim zemin, turuncu yelek vurgusu. Telefona göre tek kolon (max 720px), alt menü, alttan açılan paneller. */
:root{
  --bg:#0A1510; --bg2:#0F1E17; --card:#13261D; --card2:#1A3127; --card3:#22402F;
  --line:rgba(226,240,230,.09); --line2:rgba(226,240,230,.18);
  --ink:#EEF5EF; --muted:#93AB9C; --dim:#6B8676;
  --turf:#2E9D5B; --turf2:#1C6B3D; --bib:#FF7A1A; --bib2:#FF9A4D; --gold:#F2C14E;
  --ok:#3DD07A; --bad:#FF5D52; --warn:#FFB23F; --info:#62AEFF;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --nav:66px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  background-image:radial-gradient(130% 55% at 50% -12%,rgba(46,157,91,.26),transparent 62%);background-attachment:fixed;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 20px)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bib);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:2.3rem;font-weight:900}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:.84rem}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Üst şerit */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:rgba(10,21,16,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;flex:none}
.brand .t{min-width:0}
.brand b{display:block;font-family:var(--display);font-weight:900;font-size:1.55rem;letter-spacing:.06em;line-height:.9}
.brand small{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm{font-size:.62rem;font-weight:800;letter-spacing:.1em;background:var(--bib);color:#1A0E02;padding:3px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
.meBtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;font-weight:700;font-size:.85rem;max-width:46%}
.meBtn span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meBtn.ask{padding:8px 14px;background:var(--bib);color:#1A0E02;border-color:var(--bib)}

/* Alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(11,22,17,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto;height:var(--nav);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.nav .ic{display:grid;place-items:center;width:46px;height:28px;border-radius:99px;transition:background .2s}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--bib)}
.nav button[aria-current="page"] .ic{background:rgba(255,122,26,.16)}

main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 8px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.ph .muted{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--card2);padding:10px 16px;border-radius:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:transform .1s,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--bib);border-color:var(--bib);color:#1A0E02}
.btn.turf{background:var(--turf);border-color:var(--turf);color:#fff}
.btn.light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);background:none}
.btn.wa{background:#1F7A45;border-color:#25A85C;color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select{padding:11px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);min-width:0;width:100%;min-height:46px}
label.f{display:grid;gap:6px;font-size:.78rem;color:var(--muted);font-weight:700;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}.chip.info{color:var(--info)}.chip.muted{color:var(--muted)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.note{font-size:.86rem;padding:12px 14px;border-radius:14px;background:var(--card2);color:var(--muted)}
.note b{color:var(--ink)}
.note.warn{background:rgba(255,178,63,.12);color:#FFD08A}
.empty{text-align:center;padding:26px 12px;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink)}
.bibdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--bib);margin-right:6px;vertical-align:1px}
.nobib{display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid #E8EFE9;margin-right:6px;vertical-align:1px}

/* Sıradaki maç */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;
  background:linear-gradient(155deg,#238A4E 0%,#145232 52%,#0E3322 100%);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px -22px rgba(46,157,91,.7)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 30px,transparent 30px 60px);pointer-events:none}
.hero::after{content:"";position:absolute;width:190px;height:190px;border:2px solid rgba(255,255,255,.13);border-radius:50%;right:-70px;top:-60px;pointer-events:none}
.hero>*{position:relative}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cd{font-size:.74rem;font-weight:800;background:rgba(0,0,0,.28);padding:5px 10px;border-radius:99px;letter-spacing:.02em}
.hero-main{display:flex;justify-content:space-between;align-items:center;gap:12px}
.when{display:grid;line-height:.9;min-width:0}
.when .wd{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,13vw,3.6rem);text-transform:uppercase}
.when .dt{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,7vw,1.9rem);color:var(--bib2);text-transform:uppercase}
.when .tm{margin-top:10px;font-size:.88rem;font-weight:600;color:rgba(255,255,255,.85);line-height:1.3;display:flex;gap:6px;align-items:center}
.when .tm svg{width:16px;height:16px;flex:none}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{width:88px;height:88px}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:.9}
.ring b{font-family:var(--display);font-weight:900;font-size:1.9rem}
.ring span{font-size:.7rem;font-weight:700;opacity:.8}
.rsvpBig{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rb{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.22);color:#fff;border-radius:16px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:.82rem;transition:transform .12s,background .2s}
.rb svg{width:22px;height:22px}
.rb:active{transform:scale(.96)}
.rb.g.on{background:#3DD07A;border-color:#3DD07A;color:#062512}
.rb.y.on{background:#FFB23F;border-color:#FFB23F;color:#2B1A00}
.rb.n.on{background:#FF5D52;border-color:#FF5D52;color:#2B0503}
.hero-note{font-size:.86rem;background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Oyuncu satırları */
.list{display:grid}
.grp{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:12px 0 4px}
.pl{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.pl:last-child{border-bottom:0}
.pl .pi{flex:1;min-width:0;display:grid;gap:2px}
.pl .pi b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pi>span{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-family:var(--display);font-weight:900;font-size:1.05rem;flex:none;color:#241900;background:linear-gradient(150deg,#ECEFF1,#A4ADB3)}
.av.gold{background:linear-gradient(150deg,#F6DE8F,#C8962C)}
.av.bronze{background:linear-gradient(150deg,#E8BF96,#A46A3E);color:#2A1608}
.av.star{background:linear-gradient(150deg,#2B9B58,#0B2F1B);color:#F6DE8F}
.av.sm{width:30px;height:30px;font-size:.85rem}
.avw{position:relative;flex:none;display:block}
.avw .ab{position:absolute;right:-5px;bottom:-4px;font-family:var(--display);font-weight:900;font-size:.72rem;background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:0 4px;line-height:1.35}
.avbtn{border:0;background:none;padding:0;flex:none}
.ms{display:inline-flex;gap:4px;flex:none}
.ms button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);color:var(--muted);display:grid;place-items:center;padding:0}
.ms svg{width:17px;height:17px}
.ms button.on.g{background:var(--ok);border-color:var(--ok);color:#062512}
.ms button.on.y{background:var(--warn);border-color:var(--warn);color:#2B1A00}
.ms button.on.n{background:var(--bad);border-color:var(--bad);color:#2B0503}

/* Takım kurma seçenekleri */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.act{border:1px solid var(--line2);background:var(--card2);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;transition:transform .12s,border-color .2s}
.act:active{transform:scale(.98)}
.act:hover{border-color:var(--bib)}
.act svg{width:26px;height:26px;color:var(--bib);margin-bottom:4px}
.act b{font-size:.98rem}
.act span{font-size:.78rem;color:var(--muted)}
.act:disabled{opacity:.4}

/* Takımlar ve saha */
.cmp{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:1.35rem}
.cmp .bar2{flex:1;height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--card2)}
.cmp .bar2 i{display:block;height:100%}
.lineup{display:grid;gap:16px;align-items:start}
@media (min-width:700px){.lineup{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.field{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:68/100;border-radius:18px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#1F7E46 0 8.33%,#1A6F3D 8.33% 16.66%);box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.field svg.lines{position:absolute;inset:0;width:100%;height:100%}
.formlbl{position:absolute;font-family:var(--display);font-weight:900;font-size:.9rem;color:#fff;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:7px;letter-spacing:.04em}
.tok{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:22%;color:#fff}
.tok .shirt{width:clamp(32px,10.5vw,44px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:clamp(.95rem,3.4vw,1.2rem);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.tok.a .shirt{background:#FF7A1A;color:#1A0E02}
.tok.b .shirt{background:#F3F6F2;color:#13261B}
.tok .tn{font-size:clamp(.64rem,2.5vw,.78rem);font-weight:700;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok .to{font-family:var(--display);font-weight:900;font-size:.72rem;opacity:.9}
.tok.empty .shirt{background:transparent;border:2px dashed rgba(255,255,255,.7);color:#fff;font-size:.75rem;box-shadow:none}
.tok.sel .shirt{outline:3px solid #FFE066;outline-offset:2px}
.tok.gk .shirt{border:3px solid #FFE066}
.field.edit{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.field.edit .tok{touch-action:none;cursor:grab}
.field.edit .tok.dragging{cursor:grabbing;z-index:5}
.side{display:grid;gap:6px}
.form-pick{display:flex;flex-wrap:wrap;gap:6px}
.form-pick button{border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:6px 10px;font-family:var(--display);font-weight:900;font-size:1rem;min-height:36px}
.form-pick button.on{background:var(--turf);border-color:var(--turf);color:#fff}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.tp{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);text-align:left;min-height:40px;min-width:0}
.tp .o{font-family:var(--display);font-weight:900;font-size:1.05rem}
.tp .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tp.sel{border-color:var(--bib);box-shadow:0 0 0 2px var(--bib)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcol{background:var(--card2);border-radius:14px;padding:10px;display:grid;gap:6px;align-content:start;min-width:0}
.tcol h3{display:flex;justify-content:space-between}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool button{border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:8px 10px;font-weight:600;display:flex;gap:6px;align-items:center;min-height:40px}
.pool button b{font-family:var(--display);font-weight:900}
.timer{font-family:var(--display);font-weight:900;font-size:2.2rem;color:var(--bib)}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;flex:none}
details[open]>summary::before{transform:rotate(45deg)}
.pool-box{background:var(--card2);border-radius:14px;padding:4px 12px}

/* Skor ve istatistik */
.scoreEdit{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.se{display:grid;gap:6px;justify-items:center}
.se .tn{font-family:var(--display);font-weight:800;font-size:1rem;text-transform:uppercase}
.se .big{font-family:var(--display);font-weight:900;font-size:3.6rem;line-height:.9}
.se .pm{display:flex;gap:8px}
.rnd{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);display:grid;place-items:center;font-size:1.3rem;font-weight:800;padding:0}
.dash{font-family:var(--display);font-weight:900;font-size:2rem;color:var(--dim)}
.tblock{display:grid}
.tblock h3{padding:6px 0}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.srow .who{min-width:0}
.srow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .who span{font-size:.76rem;color:var(--muted)}
.srow .pts{font-family:var(--display);font-weight:900;font-size:1.5rem;text-align:right;line-height:.9;grid-row:1;grid-column:2}
.srow .pts small{display:block;font-family:var(--body);font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.srow .steps{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:600px){.srow{grid-template-columns:minmax(0,1fr) 340px auto}.srow .steps{grid-column:2;grid-row:1}.srow .pts{grid-column:3}}
.stp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;row-gap:2px;background:var(--card2);border-radius:12px;padding:5px}
.stp label{grid-column:1/-1;text-align:center;font-size:.62rem;font-weight:800;color:var(--muted);letter-spacing:.08em}
.stp button{width:34px;height:34px;border-radius:9px;border:0;background:var(--card3);font-weight:800;font-size:1.1rem;padding:0}
.stp b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.stp.on{background:rgba(255,122,26,.18)}

/* Sonuç */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;text-align:center}
.sb .t{display:grid;gap:4px;justify-items:center}
.sb .tn{font-family:var(--display);font-weight:800;font-size:1rem;text-transform:uppercase}
.sb .sc{font-family:var(--display);font-weight:900;font-size:4rem;line-height:.85}
.sb .t.win .sc{color:var(--bib)}
.sb .gs{font-size:.76rem;color:var(--muted);line-height:1.35}
.sb .dash{padding-top:28px}
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aw{background:var(--card2);border-radius:14px;padding:10px;display:grid;gap:4px;min-width:0}
.aw span{font-size:.62rem;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.aw b{font-family:var(--display);font-weight:900;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aw.motm{background:linear-gradient(150deg,rgba(242,193,78,.25),rgba(242,193,78,.06))}

  const PS=side==="A"?m.pos_a:m.pos_b;if(i>0&&PS&&PS.length===TEAM_SIZE&&PS[i])return PS[i][2];
  const F=FORMS[side==="A"?m.form_a:m.form_b];if(i>0&&F&&F.slots[i])return F.slots[i][2];

const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};

  if(ms<-2*36e5)return"Maç oynandı";if(ms<0)return"Maç şu an oynanıyor";
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4);
  if(d>0)return`${d} gün ${h} saat kaldı`;if(h>0)return`${h} saat ${mi} dk kaldı`;return`${mi} dk kaldı`}

function topVote(m,key){const t={};for(const v of Object.values(m.votes||{})){const id=v&&v[key];if(id)t[id]=(t[id]||0)+1}
  const e=Object.entries(t).sort((a,b)=>b[1]-a[1]);if(!e.length)return null;if(e[1]&&e[1][1]===e[0][1])return null;return e[0][0]}
function matchPoints(m,pid,motmId){
  const side=sideOf(m,pid);if(!side)return null;const role=roleIn(m,pid,side);const st=(m.stats||{})[pid]||{};
  const my=side==="A"?+m.score_a||0:+m.score_b||0,op=side==="A"?+m.score_b||0:+m.score_a||0;
  const parts=[];let pts=0;const add=(l,v)=>{if(v){parts.push([l,v]);pts+=v}};
  const g=+st.g||0,a=+st.a||0,og=+st.og||0;
  add("Katılım",RULES.katilim);add(g+" gol",g*RULES.gol[role]);add(a+" asist",a*RULES.asist);
  add(my>op?"Galibiyet":"Beraberlik",my>op?RULES.galibiyet:my===op?RULES.beraberlik:0);
  for(const[lim,v]of RULES.savunma){if(op<=lim){add(op===0?"Gol yemedi":op+" gol yedi",v[role]);break}}
  add("Kendi kalesine",og*RULES.kk);add("Maçın Adamı",motmId===pid?RULES.motm:0);
  return{pts,parts,role,g,a,res:my>op?"G":my<op?"M":"B",side,op};
}
const ptsToDelta=p=>clamp(Math.round((p-RULES.ortalama)/2.5),-2,3)||0;
function baseOf(p){const set=attrSet(p.pos);const a=p.attrs||{};return Math.round(set.reduce((s,[k])=>s+(+a[k]||65),0)/set.length)}
function compute(){
  const F=fin();const mInfo={};const out={};
  for(const m of F){const motm=topVote(m,"motm"),fiy=topVote(m,"fiyasko"),gol=topVote(m,"gol");
    const pl=[...(m.team_a||[]),...(m.team_b||[])];const pts={};for(const id of pl)pts[id]=matchPoints(m,id,motm);
    const totw=pl.filter(id=>pts[id]&&P(id)).sort((a,b)=>pts[b].pts-pts[a].pts).slice(0,5);mInfo[m.id]={motm,fiy,gol,pts,totw}}
  for(const p of S.all){
    const base=baseOf(p);let ovr=base;const joined=p.created_at?new Date(new Date(p.created_at).toDateString()).getTime():0;
    const hist=[],series=[base];let games=0,goals=0,ast=0,W=0,D=0,L=0,motm=0,fiy=0,golu=0,totw=0,hat=0,elig=0,streak=0,best=0,late=0,cs=0,ptsSum=0,bestM=null;
    for(const m of F){
      if(matchTs(m)<joined)continue;elig++;const inf=mInfo[m.id];const r=inf.pts[p.id];let d,line;
      if(r){games++;streak++;best=Math.max(best,streak);goals+=r.g;ast+=r.a;if(r.g>=3)hat++;
        if(r.res==="G")W++;else if(r.res==="B")D++;else L++;
        if(inf.motm===p.id)motm++;if(inf.fiy===p.id)fiy++;if(inf.gol===p.id)golu++;if(inf.totw.includes(p.id))totw++;
        if(r.op<=2&&(r.role==="KL"||r.role==="DF"))cs++;ptsSum+=r.pts;if(!bestM||r.pts>bestM.pts)bestM={pts:r.pts,date:m.date};
        d=ptsToDelta(r.pts);line={kind:"oynadi",r};
      }else{streak=0;const lc=!!(m.late||{})[p.id];if(lc)late++;d=lc?RULES.sonDakika:RULES.gelmedi;line={kind:lc?"iptal":"gelmedi"}}
      const before=ovr;ovr=clamp(ovr+d,Math.max(40,base-RULES.aralik),Math.min(99,base+RULES.aralik));
      hist.push({m,d:ovr-before,ovr,...line});series.push(ovr);
    }
    const last=hist[hist.length-1];const a=p.attrs||{};const last5=hist.slice(-5);
    const g5=last5.reduce((s,h)=>s+(h.r?h.r.g:0),0),a5=last5.reduce((s,h)=>s+(h.r?h.r.a:0),0),miss5=last5.filter(h=>!h.r).length;
    const cs5=last5.filter(h=>h.r&&(h.r.role==="KL"||h.r.role==="DF")&&h.r.op<=2).length;
    const sh=Math.round((ovr-base)/3);const v=k=>clamp((+a[k]||65)+sh,30,99);
    const attrs=p.pos==="Kaleci"?{dal:v("dal"),ell:v("ell"),ayk:v("ayk"),ref:clamp(v("ref")+Math.min(4,cs5*2),30,99),hiz:v("hiz"),poz:v("poz")}
      :{hiz:v("hiz"),sut:clamp(v("sut")+Math.min(4,g5),30,99),pas:clamp(v("pas")+Math.min(4,a5),30,99),dri:v("dri"),def:clamp(v("def")+Math.min(4,cs5*2),30,99),fiz:clamp(v("fiz")-miss5*2,30,99)};
    const badges=[];
    if(hat)badges.push({i:"3",t:"Hat-trick",d:hat+" kez tek maçta 3+ gol"});
    if(motm)badges.push({i:"★",t:"Maçın Adamı",d:motm+" kez seçildi"});
    if(totw)badges.push({i:"XI",t:"Haftanın Takımı",d:totw+" kez ilk beşte"});
    if(goals>=10)badges.push({i:"10",t:"Golcü",d:goals+" gol attı"});
    if(ast>=10)badges.push({i:"A",t:"Pasör",d:ast+" asist yaptı"});
    if(best>=8)badges.push({i:"8",t:"Demir Adam",d:best+" maç üst üste geldi"});
    if(cs>=3)badges.push({i:"0",t:"Duvar",d:cs+" maçta en fazla 2 gol yedi"});
    if(elig>=5&&games/elig>=.9)badges.push({i:"%",t:"Sadık",d:"Maçların %"+Math.round(games/elig*100)+"'ine geldi"});
    if(golu)badges.push({i:"G",t:"Haftanın Golü",d:golu+" kez"});
    if(fiy>=2)badges.push({i:"?!",t:"Fiyasko Ustası",d:fiy+" kez seçildi",shame:true});
    if(late>=2)badges.push({i:"!",t:"Son Dakikacı",d:late+" kez son gün iptal",shame:true});
    out[p.id]={base,ovr,hist,series,games,goals,ast,W,D,L,motm,fiy,golu,totw,elig,best,late,ptsSum,bestM,avgPts:games?ptsSum/games:null,att:elig?games/elig:null,lastD:last?last.d:0,attrs,badges};
  }
  S.stats=out;S.mInfo=mInfo;
}

async function act(fn,args,okMsg){

    if(r&&r.ok===false){
      if(r.error==="pin"||r.error==="locked"){S.admin=false;S.pin="";LS.del("y_pin");toast(r.error==="locked"?"Çok fazla hatalı deneme. 15 dakika sonra tekrar dene.":"Yönetici şifresi geçersiz, tekrar giriş yap.")}

      await load();return null}

  }catch(e){console.error(e);toast("Kaydedilemedi. Bağlantını kontrol et.");return null}

function gkCounts(){const c={};for(const m of S.matches){const a=(m.lineup_a||[])[0],b=(m.lineup_b||[])[0];if(a)c[a]=(c[a]||0)+1;if(b)c[b]=(c[b]||0)+1}return c}
function pickGk(ids){const kl=ids.filter(id=>posOf(P(id))==="KL");if(kl.length)return kl.sort((a,b)=>ovrOf(b)-ovrOf(a))[0];const c=gkCounts();
  return [...ids].sort((a,b)=>(c[a]||0)-(c[b]||0)||ovrOf(a)-ovrOf(b))[0]||null}
function balanceIds(ids){
  const n=ids.length,half=Math.floor(n/2);if(half<1)return{A:ids,B:[]};
  const ov=Object.fromEntries(ids.map(id=>[id,ovrOf(id)]));const kl=ids.filter(id=>posOf(P(id))==="KL");const res=[];const first=ids[0],rest=ids.slice(1);
  const cnt=(T,r)=>T.filter(x=>posOf(P(x))===r).length;
  const rec=(start,pick)=>{
    if(pick.length===half-1){const Ta=[first,...pick];const Tb=ids.filter(x=>!Ta.includes(x));
      const sa=Ta.reduce((s,x)=>s+ov[x],0)/Ta.length,sb=Tb.reduce((s,x)=>s+ov[x],0)/Tb.length;let sc=Math.abs(sa-sb);
      if(kl.length>=2&&(kl.every(k=>Ta.includes(k))||kl.every(k=>Tb.includes(k))))sc+=50;
      for(const r of["DF","OS","FV"])sc+=Math.max(0,Math.abs(cnt(Ta,r)-cnt(Tb,r))-1)*.6;res.push([sc,Ta,Tb]);return}
    for(let i=start;i<rest.length;i++){pick.push(rest[i]);rec(i+1,pick);pick.pop();if(res.length>60000)return}};
  rec(0,[]);res.sort((a,b)=>a[0]-b[0]);const best=res[0][0];const near=res.filter(r=>r[0]<=best+.4).slice(0,40);const pk=near[Math.floor(Math.random()*near.length)];
  return Math.random()<.5?{A:pk[1],B:pk[2]}:{A:pk[2],B:pk[1]};
}
function autoLineup(ids,fk){
  const slots=FORMS[fk].slots;const out=new Array(slots.length).fill(null);let pool=[...ids];
  const gk=pickGk(pool);if(gk){out[0]=gk;pool=pool.filter(x=>x!==gk)}
  const byO=arr=>arr.sort((a,b)=>ovrOf(b)-ovrOf(a));
  for(let i=1;i<slots.length;i++){const c=byO(pool.filter(id=>posOf(P(id))===slots[i][2]))[0];if(c){out[i]=c;pool=pool.filter(x=>x!==c)}}
  const near={DF:["OS","FV","KL"],OS:["DF","FV","KL"],FV:["OS","DF","KL"]};
  for(let i=1;i<slots.length;i++){if(out[i])continue;let c=null;for(const r of near[slots[i][2]]){c=byO(pool.filter(id=>posOf(P(id))===r))[0];if(c)break}
    if(!c)c=byO(pool)[0];if(c){out[i]=c;pool=pool.filter(x=>x!==c)}}
  return out;
}

function spiker(m,inf){
  const r=hash(m.id);const pick=arr=>arr[r%arr.length];const sa=+m.score_a||0,sb=+m.score_b||0;const stt=m.stats||{};
  const W=sa>sb?"A":sb>sa?"B":null;const Lz=W==="A"?"B":"A";const diff=Math.abs(sa-sb);
  const pl=[...(m.team_a||[]),...(m.team_b||[])];
  const top=pl.filter(id=>+stt[id]?.g).sort((a,b)=>(+stt[b].g)-(+stt[a].g))[0];const tg=top?+stt[top].g:0;
  const ast=pl.filter(id=>+stt[id]?.a).sort((a,b)=>(+stt[b].a)-(+stt[a].a))[0];const N=id=>nameOf(id);
  let head;
  if(tg>=3)head=pick([`${up(N(top))} GECEYE DAMGA VURDU`,`${up(N(top))} DURDURULAMADI: ${tg} GOL`,`HAT-TRICK ALARMI: ${up(N(top))}`]);
  else if(!W)head=pick([`DOSTLAR ALIŞVERİŞTE GÖRSÜN: ${sa}-${sb}`,`KAZANAN YOK, KONUŞAN ÇOK`,`NEFES KESEN BERABERLİK`]);
  else if(diff>=5)head=pick([`${up(TEAM[W])} SAHAYI DÜMDÜZ ETTİ`,`${up(TEAM[Lz])} İÇİN KARA GECE`,`FARK ${diff}: ${up(TEAM[W])} ACIMADI`]);
  else if(diff===1)head=pick([`TEK FARK, BÜYÜK SEVİNÇ`,`${up(TEAM[W])} SON SÖZÜ SÖYLEDİ`,`NEFESLER TUTULDU, ${up(TEAM[W])} GÜLDÜ`]);
  else head=pick([`${up(TEAM[W])} GÜLEN TARAF OLDU`,`${up(TEAM[W])} İŞİNİ BİLDİ`,`ZAFER ${up(TEAM[W])}'İN`]);
  const fld=S.settings.field_name?S.settings.field_name+" sahasında":"sahada";
  let body=`${fmtDate(m.date)} akşamı ${fld} oynanan karşılaşma ${W?`${TEAM[W]}'in ${Math.max(sa,sb)}-${Math.min(sa,sb)}'lik galibiyetiyle`:`${sa}-${sb} beraberlikle`} sona erdi. `;
  if(top)body+=tg>=3?`Gecenin yıldızı ${tg} golle ${N(top)} oldu; rakip savunma bu ismi uzun süre unutmayacak. `:`Gol yollarında en etkili isim ${tg} golle ${N(top)} oldu. `;
  if(ast)body+=`${N(ast)} ${+stt[ast].a} asistle oyunun beyni görevini üstlendi. `;
  for(const k of["A","B"]){const gk=lineupOf(m,k)[0];const conc=k==="A"?sb:sa;if(gk){if(conc===0)body+=`${N(gk)} kalesini gole kapattı, tribünler ayakta. `;else if(conc>=8)body+=`${N(gk)} için zor bir geceydi: kalesinde ${conc} gol gördü. `}}
  if(inf.motm)body+=`Oyuncuların oylarıyla Maçın Adamı ${N(inf.motm)} seçildi. `;
  if(inf.fiy)body+=`Haftanın Fiyaskosu ise ${N(inf.fiy)}; soyunma odasında bu konu daha çok konuşulur.`;
  return `<span class="eyebrow">Spiker</span><strong>${esc(head)}</strong>${esc(body.trim())}`;
}

function spark(arr){if(arr.length<2)return"";const W=220,H=46,mn=Math.min(...arr)-1,mx=Math.max(...arr)+1;
  const pts=arr.map((v,i)=>[i/(arr.length-1)*(W-8)+4,H-4-(v-mn)/(mx-mn)*(H-8)]);const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");const l=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Reyting değişimi"><path d="${d} L${l[0]} ${H} L4 ${H}Z" fill="#2E9D5B" opacity=".18"/><path d="${d}" fill="none" stroke="#3DD07A" stroke-width="2"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="#FF7A1A"/></svg>`}

  const ys={};for(const p of S.all)ys[p.id]={g:0,a:0,motm:0,fiy:0,games:0,pts:0};
  for(const m of F){const inf=S.mInfo[m.id];for(const[id,r]of Object.entries(inf.pts)){if(!ys[id]||!r)continue;ys[id].games++;ys[id].g+=r.g;ys[id].a+=r.a;ys[id].pts+=r.pts}
    if(inf.motm&&ys[inf.motm])ys[inf.motm].motm++;if(inf.fiy&&ys[inf.fiy])ys[inf.fiy].fiy++}
  const board=(t,key,fmt,filt)=>{const l=S.players.filter(p=>filt?filt(ys[p.id]):ys[p.id][key]>0).sort((a,b)=>key==="avg"?ys[b.id].pts/ys[b.id].games-ys[a.id].pts/ys[a.id].games:ys[b.id][key]-ys[a.id][key]).slice(0,5);
    return `<section class="card board"><h3>${t}</h3>${l.length?`<ol>${l.map((p,i)=>`<li><span><span class="rk">${i+1}</span>${esc(p.name)}</span><b>${fmt(ys[p.id])}</b></li>`).join("")}</ol>`:'<p class="muted small">Henüz veri yok.</p>'}</section>`};
  let h=`<div class="ph"><div><h1>Sezon ${yr}</h1><span class="muted">${F.length} maç oynandı</span></div></div>`;
  if(!F.length)h+=`<section class="card"><div class="empty"><h3>Sezon yeni başlıyor</h3><p>İlk maç bitip istatistikler girilince krallık tabloları burada dolacak.</p></div></section>`;
  else h+=`<div class="boards">${board("Gol krallığı","g",x=>x.g)}${board("Asist krallığı","a",x=>x.a)}${board("Maçın Adamı","motm",x=>x.motm+"×")}${board("Puan ortalaması","avg",x=>(x.pts/x.games).toFixed(1),x=>x.games>=3)}${board("Demir adamlar","games",x=>x.games)}${board("Fiyasko listesi","fiy",x=>x.fiy+"×")}</div>`;
  const wp=P(S.f.wrapP||S.me);
  h+=`<section class="card"><div class="ch"><div><div class="eyebrow">Yıl özeti</div><h2>${wp?esc(firstName(wp.name))+" · "+yr:"Bir oyuncu seç"}</h2></div>
    <select id="wrapSel" data-bind="wrapP" aria-label="Oyuncu" style="width:auto"><option value="">Seç</option>${S.players.map(p=>`<option value="${esc(p.id)}"${wp&&wp.id===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select></div>`;
  if(wp){const y=ys[wp.id]||{};const s=S.stats[wp.id]||{};const bm=s.bestM&&parseYmd(s.bestM.date).getFullYear()===yr?s.bestM:null;const diff=(s.ovr||0)-(s.base||0);
    h+=`<div class="wrapped"><div class="slide"><span class="lb">Bu yıl sahaya çıktın</span><span class="big num">${y.games||0}</span><span>maç. ${s.best>=4?"En uzun serin "+s.best+" maç üst üste.":"Seneye daha sık bekliyoruz."}</span></div>
      <div class="slide"><span class="lb">Gol + asist</span><span class="big num">${(y.g||0)+(y.a||0)}</span><span>${y.g||0} gol, ${y.a||0} asist.</span></div>
      <div class="slide"><span class="lb">En iyi maçın</span><span class="big num">${bm?bm.pts:"–"}</span><span>${bm?fmtDate(bm.date)+" maçında aldığın puan.":"Henüz puanlı maç yok."}</span></div>
      <div class="slide"><span class="lb">Kartın şimdi</span><span class="big num">${s.ovr||"–"}</span><span>Başlangıçtan ${diff>0?"+"+diff:diff} puan.${y.motm?" "+y.motm+" kez Maçın Adamı seçildin.":""}</span></div>
      <div class="slide"><span class="lb">Rozetler</span><span class="big num">${(s.badges||[]).filter(b=>!b.shame).length}</span><span>${(s.badges||[]).map(b=>esc(b.t)).join(", ")||"Daha rozet yok."}</span></div></div>`}
  h+=`</section>`;
  const tally={};S.seasonVotes.forEach(v=>tally[v.target]=(tally[v.target]||0)+1);const ranked=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const mine=(S.seasonVotes.find(v=>v.voter===S.me)||{}).target||"";
  h+=`<section class="card board"><div class="ch"><div><div class="eyebrow">Yıl sonu ödülü</div><h2>Altın Top ${yr}</h2></div><span class="muted small">${S.seasonVotes.length} oy</span></div>
    ${S.me?`<div class="grid2"><select id="atVote" data-bind="atVote" aria-label="Altın Top oyu"><option value="">Oyunu seç</option>${S.players.filter(p=>p.id!==S.me).map(p=>`<option value="${esc(p.id)}"${(S.f.atVote||mine)===p.id?" selected":""}>${esc(p.name)}</option>`).join("")}</select><button class="btn primary" data-act="atVote">${mine?"Oyumu değiştir":"Oy ver"}</button></div>`:'<button class="btn block" data-act="meSheet">Oy vermek için kim olduğunu seç</button>'}
    ${ranked.length?`<ol>${ranked.slice(0,5).map(([id,n],i)=>`<li><span><span class="rk">${i+1}</span>${esc(nameOf(id))}</span><b>${n}</b></li>`).join("")}</ol>`:'<p class="muted small">Henüz oy yok. Herkes kendi dışında bir oyuncuya oy verir.</p>'}</section>`;
  return h;
}

  <section class="card"><h2>Maç puanı</h2><div class="rules">${row("Maça gelmek",f(r.katilim))}${row("Galibiyet",f(r.galibiyet))}${row("Beraberlik",f(r.beraberlik))}${row("Asist",f(r.asist))}
   ${row("Gol · forvet",f(r.gol.FV))}${row("Gol · orta saha",f(r.gol.OS))}${row("Gol · defans ya da kaleci",f(r.gol.DF))}${row("Kendi kalesine gol",r.kk)}${row("Maçın Adamı (oylama)",f(r.motm))}</div></section>
  <section class="card"><h2>Yenilen gole göre savunma puanı</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Takım kaç gol yedi</th><th>Kaleci</th><th>Defans</th><th>Orta saha</th><th>Forvet</th></tr></thead><tbody>
   ${[["Hiç",0],["1–2",1],["3–4",2],["5–7",3],["8 ve üstü",4]].map(([l,i])=>{const v=r.savunma[i][1];return `<tr><td>${l}</td><td>${f(v.KL)}</td><td>${f(v.DF)}</td><td>${f(v.OS)}</td><td>${f(v.FV)}</td></tr>`}).join("")}</tbody></table></div></section>
  <section class="card"><h2>Puandan reytinge</h2><div class="rules">${row("3 ve altı","−2")}${row("4–5","−1")}${row("6–8","0")}${row("9–10","+1")}${row("11–13","+2")}${row("14 ve üstü","+3")}</div></section>
  <section class="card"><h2>Maça gelmeyince</h2><div class="rules">${row("Gelmedi (sakatlık, hastalık, izin fark etmez)",r.gelmedi)}${row("Maça 24 saatten az kala iptal",r.sonDakika)}</div>
  <p class="muted small">Oyuncu o maç dizilişte hangi mevkide oynadıysa o mevkiden puan alır; kaleye geçen kaleci gibi puanlanır. Reyting başlangıcın en fazla ${r.aralik} puan altına ya da üstüne gidebilir ve 40–99 arasında kalır. Karttaki ŞUT, PAS, DEF ve FİZ son beş maçtaki gol, asist, az gol yeme ve devamlılığa göre oynar; kalecide REF az gol yedikçe artar.</p></section>`;
}

document.addEventListener("click",async e=>{
  const tb=e.target.closest(".nav button[data-tab]");if(tb){S.tab=tb.dataset.tab;S.view=null;LS.set("y_tab",S.tab);history.replaceState(null,"","#"+S.tab);render(true);window.scrollTo(0,0);return}
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;if(a==="closeBg"&&e.target!==el)return;const id=el.dataset.id;const t=S.teams;
  switch(a){
    case"tab":S.tab=el.dataset.tab;render(true);break;
    case"open":S.sheet={type:"player",id};S.f.st=null;S.f.ed=null;S.f.delP=null;render(true);break;

    case"delMatch":if(S.f.delMatch!==id){S.f.delMatch=id;render(true);break}S.f.delMatch=null;S.teams=null;await A("admin_archive_match",{p_id:id},"Maç silindi");break;
    case"rsvp":{if(el.disabled)break;const r=await act("rsvp",{p_match:el.dataset.m,p_player:el.dataset.p,p_value:el.dataset.v});if(r&&r.late)toast("Son dakika iptali kaydedildi");else if(r)toast(el.dataset.v==="g"?"Görüşürüz sahada!":el.dataset.v==="y"?"Yedek olarak yazıldı":"Gelemiyor olarak işlendi");break}
    case"copy":{const tx=el.dataset.txt;try{await navigator.clipboard.writeText(tx);toast("Kopyalandı")}catch(_){toast("Kopyalanamadı, metni elle seç")}break}
    case"balance":{const m=S.matches.find(x=>x.id===id);const ids=rsvpLists(m).kadro.map(p=>p.id);if(ids.length<2){toast("Önce katılım bekleniyor");break}const r=balanceIds(ids);S.draft=null;startEditor(id,r.A,r.B,t?.fa,t?.fb);render(true);break}
    case"editTeams":{const m=S.matches.find(x=>x.id===id);startEditor(id,m.team_a||[],m.team_b||[],m.form_a,m.form_b,m.lineup_a,m.lineup_b,m.pos_a,m.pos_b);render(true);break}
    case"manual":{const m=S.matches.find(x=>x.id===id);S.draft=null;if(m.team_a&&m.team_a.length)startEditor(id,m.team_a,m.team_b,m.form_a,m.form_b,m.lineup_a,m.lineup_b,m.pos_a,m.pos_b);else startEditor(id,[],[],t?.fa,t?.fb);S.teams.poolOpen=true;render(true);break}
    case"backRsvp":await A("admin_set_state",{p_id:id,p_state:"kayit"},"Katılım yeniden açıldı");break;
    case"cancelTeams":S.teams=null;render(true);break;
    case"form":{const k=el.dataset.k.toLowerCase();t["f"+k]=el.dataset.f;t["p"+k]=slotsOf(el.dataset.f);t["l"+k]=autoLineup(t[el.dataset.k],el.dataset.f);t.sel=null;render(true);break}
    case"autoPlace":t.la=autoLineup(t.A,t.fa);t.lb=autoLineup(t.B,t.fb);t.pa=slotsOf(t.fa);t.pb=slotsOf(t.fb);t.sel=null;render(true);break;
    case"poolAdd":{const k=el.dataset.k;if(t.A.includes(id)||t.B.includes(id))break;t[k].push(id);const L=t["l"+k.toLowerCase()];
      if(posOf(P(id))==="KL"&&!L[0])L[0]=id;else{let e2=L.findIndex((x,i)=>i>0&&!x);if(e2<0&&!L[0])e2=0;if(e2>=0)L[e2]=id}render(true);break}
    case"toPool":{const s2=t.sel;const k=s2.team;const L=t["l"+k.toLowerCase()];const pid=s2.kind==="slot"?L[s2.idx]:s2.pid;if(!pid)break;t[k]=t[k].filter(x=>x!==pid);const i=L.indexOf(pid);if(i>=0)L[i]=null;t.sel=null;render(true);break}
    case"slot":tapSlot(el.dataset.k,+el.dataset.i);render(true);break;

    case"unsel":t.sel=null;render(true);break;
    case"toBench":{const L=t["l"+t.sel.team.toLowerCase()];L[t.sel.idx]=null;t.sel=null;render(true);break}
    case"moveTeam":{const s2=t.sel;const k=s2.team,o=k==="A"?"B":"A";const L=t["l"+k.toLowerCase()];const pid=s2.kind==="slot"?L[s2.idx]:s2.pid;if(!pid)break;
      t[k]=t[k].filter(x=>x!==pid);t[o].push(pid);const i=L.indexOf(pid);if(i>=0)L[i]=null;const LO=t["l"+o.toLowerCase()];const em=LO.indexOf(null);if(em>=0)LO[em]=pid;t.sel=null;render(true);break}
    case"saveTeams":{if(!t.A.length||!t.B.length){toast("İki takımda da oyuncu olmalı");break}if(!t.la[0]||!t.lb[0]){toast("İki takıma da kaleci yerleştir");break}
      const r=await A("admin_save_lineup",{p_id:t.mid,p_team_a:t.A,p_team_b:t.B,p_form_a:t.fa,p_form_b:t.fb,p_lineup_a:t.la,p_lineup_b:t.lb,p_pos_a:t.pa,p_pos_b:t.pb},"Kadrolar kaydedildi");if(r){S.teams=null;render(true)}break}
    case"draftStart":S.teams=null;S.draft={mid:id,selA:"",selB:""};render(true);break;
    case"draftCancel":stopTimer();S.draft=null;render(true);break;
    case"draftGo":{const d=S.draft;d.capA=d.selA;d.capB=d.selB;d.A=[d.capA];d.B=[d.capB];d.turn=Math.random()<.5?"A":"B";toast(nameOf(d.turn==="A"?d.capA:d.capB)+" yazı turayı kazandı, ilk o seçiyor");d.deadline=Date.now()+20000;startTimer();render(true);break}
    case"dpick":dpick(id);break;
    case"draftDone":{stopTimer();const d=S.draft;startEditor(d.mid,d.A,d.B);S.draft=null;render(true);break}
    case"st":{const sd=S.f["sd_"+el.dataset.m];if(!sd)break;const pid=el.dataset.p;const o=sd.stats[pid]||(sd.stats[pid]={g:0,a:0,og:0});o[el.dataset.k]=clamp((+o[el.dataset.k]||0)+(+el.dataset.d),0,30);S.f.confirmFinish=null;render(true);break}
    case"sc":{const sd=S.f["sd_"+el.dataset.m];if(!sd)break;sd[el.dataset.side]=clamp(sd[el.dataset.side]+(+el.dataset.d),0,60);S.f.confirmFinish=null;render(true);break}
    case"fillScore":{const m=S.matches.find(x=>x.id===id);const sd=S.f["sd_"+id];const sum=(T,key)=>T.reduce((s,p)=>s+(+sd.stats[p]?.[key]||0),0);
      sd.a=sum(m.team_a,"g")+sum(m.team_b,"og");sd.b=sum(m.team_b,"g")+sum(m.team_a,"og");render(true);break}
    case"finish":{if(S.f.confirmFinish!==id){S.f.confirmFinish=id;render(true);break}S.f.confirmFinish=null;
      const sd=S.f["sd_"+id];const m=S.matches.find(x=>x.id===id);const stats={};for(const pid of[...m.team_a,...m.team_b]){const o=sd.stats[pid]||{};stats[pid]={g:+o.g||0,a:+o.a||0,og:+o.og||0}}
      const r=await A("admin_finish_match",{p_id:id,p_score_a:sd.a,p_score_b:sd.b,p_stats:stats},"Maç bitti, kartlar güncellendi");if(r){delete S.f["sd_"+id];window.scrollTo(0,0)}break}
    case"reopen":{const om=openMatch();if(om&&om.id!==id){toast("Önce açık maçı bitir ya da sil");break}const m=S.matches.find(x=>x.id===id);S.f["sd_"+id]={a:+m.score_a||0,b:+m.score_b||0,stats:JSON.parse(JSON.stringify(m.stats||{}))};S.view=null;
      await A("admin_set_state",{p_id:id,p_state:"takim"});break}
    case"vote":{const vd=S.f["v_"+id]||{};if(!vd.motm&&!vd.fiyasko&&!vd.gol){toast("En az bir seçim yap");break}
      await act("vote",{p_match:id,p_voter:S.me,p_motm:vd.motm||null,p_fiyasko:vd.fiyasko||null,p_gol:vd.gol||null},"Oyun kaydedildi");break}
    case"stType":S.f.st.type=el.dataset.v;render(true);break;
    case"saveStatus":{const p=P(S.sheet.id);const sf=S.f.st;await act("set_status",{p_player:p.id,p_type:sf.type,p_until:sf.type==="hazir"?null:(sf.until||null),p_note:sf.type==="hazir"?"":(sf.note||"")},"Durum güncellendi");S.f.st=null;render(true);break}
    case"saveCard":{const p=P(S.sheet.id);const a2=S.f.ed;if(!String(a2.name||"").trim()){toast("Ad boş olamaz");break}
      await A("admin_save_player",{p_id:p.id,p_name:a2.name.trim(),p_pos:a2.pos,p_no:String(a2.no||"").slice(0,2),p_attrs:cleanAttrs(a2.pos,a2.attrs)},"Kart güncellendi");S.f.ed=null;render(true);break}
    case"delPlayer":{const p=P(S.sheet.id);if(S.f.delP!==p.id){S.f.delP=p.id;render(true);break}const r=await A("admin_archive_player",{p_id:p.id},"Oyuncu kadrodan çıkarıldı");if(r){S.sheet=null;render(true)}break}
    case"atVote":{const v=S.f.atVote||(S.seasonVotes.find(x=>x.voter===S.me)||{}).target;if(!v){toast("Bir oyuncu seç");break}await act("season_vote",{p_year:new Date().getFullYear(),p_voter:S.me,p_target:v},"Altın Top oyun kaydedildi");break}
    case"logout":S.admin=false;S.pin="";LS.del("y_pin");S.teams=null;S.draft=null;render(true);toast("Yöneticilikten çıkıldı");break;
  }
});
function tapSlot(k,i){const t=S.teams;const L=t["l"+k.toLowerCase()];const s=t.sel;
  if(!s){t.sel={kind:"slot",team:k,idx:i};return}
  if(s.team!==k){t.sel={kind:"slot",team:k,idx:i};return}
  if(s.kind==="slot"){if(s.idx!==i)[L[s.idx],L[i]]=[L[i],L[s.idx]];t.sel=null;return}
  L[i]=s.pid;t.sel=null}
function tapBench(k,pid){const t=S.teams;const s=t.sel;
  if(s&&s.kind==="slot"&&s.team===k){t["l"+k.toLowerCase()][s.idx]=pid;t.sel=null;return}
  t.sel=(s&&s.kind==="bench"&&s.pid===pid)?null:{kind:"bench",team:k,pid}}
function cleanAttrs(pos,a){const o={};for(const[k]of attrSet(pos))o[k]=clamp(Math.round(+a[k]||65),30,95);return o}
document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const kind=f.dataset.form;
  if(kind==="addPlayer"){const ap=S.f.ap;const name=String(ap.name||"").trim();if(!name){toast("Ad gir");return}
    const r=await A("admin_save_player",{p_id:null,p_name:name,p_pos:ap.pos,p_no:String(ap.no||"").slice(0,2),p_attrs:cleanAttrs(ap.pos,ap.attrs)},name+" kadroya eklendi");
    if(r){S.f.ap={name:"",pos:ap.pos,no:"",attrs:{}};render(true);setTimeout(()=>$("#apName")?.focus(),0)}}
  if(kind==="login"){const pin=String(S.f.pin||"");if(!pin){toast("Şifreyi gir");return}
    try{const r=await rpc("admin_check",{p_pin:pin});if(r&&r.ok){S.pin=pin;S.admin=true;LS.set("y_pin",pin);S.f.pin="";toast("Yönetici olarak giriş yapıldı");render(true)}
      else toast(r&&r.error==="locked"?"Çok fazla hatalı deneme. 15 dakika sonra tekrar dene.":"Şifre hatalı")}catch(_){toast("Bağlantı hatası")}}
  if(kind==="settings"){const s=S.f.set;await A("admin_save_settings",{p_group:s.group_name,p_field:s.field_name,p_day:+s.day,p_time:s.time||"21:00"},"Ayarlar kaydedildi");S.f.set=null;render(true)}
  if(kind==="pinChange"){const np=String(S.f.newPin||"");if(np.length<6){toast("Yeni şifre en az 6 karakter olmalı");return}
    const r=await A("admin_change_pin",{p_new:np},"Şifre değiştirildi");if(r){S.pin=np;LS.set("y_pin",np);S.f.newPin=""}}
});
function setPath(path,v){const ks=path.split(".");let o=S.f;for(let i=0;i<ks.length-1;i++)o=o[ks[i]]||(o[ks[i]]={});o[ks[ks.length-1]]=v}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.bind)setPath(t.dataset.bind,t.value);
  if(t.dataset.attr){const pre=t.dataset.attr,k=t.dataset.k;const obj=S.f[pre];if(!obj)return;const v=clamp(+t.value||30,30,95);obj.attrs[k]=v;
    document.querySelectorAll(`[data-attr="${pre}"][data-k="${k}"]`).forEach(x=>{if(x!==t)x.value=v});const o=$("#"+pre+"_ovr");if(o)o.textContent=baseOf({pos:obj.pos,attrs:obj.attrs})}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);if(["sort","wrapP","ap.pos","ed.pos","newDate","newTime"].includes(t.dataset.bind))render(true);return}
  if(t.dataset.vote){const k="v_"+t.dataset.m;(S.f[k]||(S.f[k]={}))[t.dataset.vote]=t.value;return}
  if(t.dataset.actChange==="cap"&&S.draft){S.draft["sel"+t.dataset.k]=t.value;render(true)}
});
document.addEventListener("toggle",e=>{const d=e.target;if(!d.dataset)return;if(d.dataset.actToggle)S.f[d.dataset.actToggle]=d.open;if(d.dataset.actToggleTeam&&S.teams)S.teams[d.dataset.actToggleTeam]=d.open},true);
document.addEventListener("focusout",()=>{setTimeout(()=>{if(S.pending&&!isEditing())render()},0)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render(true)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
setInterval(()=>{if(document.visibilityState==="visible"&&!S.teams&&!S.draft&&!S.sheet)load()},25000);

/* Sahada sürükle-bırak */
let DRAG=null,SUPPRESS=false;
document.addEventListener("pointerdown",e=>{const tok=e.target.closest(".field.edit .tok");if(!tok||!S.teams)return;if(e.pointerType==="mouse")e.preventDefault();
  DRAG={tok,k:tok.dataset.k,i:+tok.dataset.i,sx:e.clientX,sy:e.clientY,f:tok.closest(".field").getBoundingClientRect(),moved:false,id:e.pointerId}});
document.addEventListener("pointermove",e=>{if(!DRAG||e.pointerId!==DRAG.id)return;const d=DRAG;
  if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<7)return;
  if(!d.moved){d.moved=true;d.tok.classList.add("dragging");try{d.tok.setPointerCapture(e.pointerId)}catch(_){}}
  e.preventDefault();const l=clamp((e.clientX-d.f.left)/d.f.width*100,4,96);let tp=clamp((e.clientY-d.f.top)/d.f.height*100,3,97);
  tp=d.k==="A"?clamp(tp,50,97):clamp(tp,3,50);d.tok.style.left=l+"%";d.tok.style.top=tp+"%";d.l=l;d.t=tp},{passive:false});
function endDrag(e){if(!DRAG||(e&&e.pointerId!==DRAG.id))return;const d=DRAG;DRAG=null;if(!d.moved)return;SUPPRESS=true;setTimeout(()=>SUPPRESS=false,50);
  const t=S.teams;if(!t||d.l==null){render(true);return}const u=unpos2(d.k,d.l,d.t);const x=Math.round(clamp(u.x,4,96)),y=Math.round(clamp(u.y,2,100));
  t["p"+d.k.toLowerCase()][d.i]=[x,y,roleFromY(d.i,y)];t.sel=null;render(true)}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
document.addEventListener("click",e=>{if(SUPPRESS){e.stopImmediatePropagation();e.preventDefault()}},true);

/* Draft zamanlayıcı */
function startTimer(){stopTimer();S.tick=setInterval(()=>{const d=S.draft;if(!d||!d.deadline)return stopTimer();const left=Math.ceil((d.deadline-Date.now())/1000);const el=$("#dtimer");if(el)el.textContent=Math.max(0,left);
  if(left<=0){const m=S.matches.find(x=>x.id===d.mid);const pool=rsvpLists(m).kadro.map(p=>p.id).filter(id=>!d.A.includes(id)&&!d.B.includes(id)).sort((a,b)=>ovrOf(b)-ovrOf(a));if(pool[0]){toast("Süre doldu, en yüksek reytingli seçildi");dpick(pool[0])}}},250)}
function stopTimer(){clearInterval(S.tick);S.tick=null}
function dpick(id){const d=S.draft;if(!d)return;(d.turn==="A"?d.A:d.B).push(id);d.turn=d.turn==="A"?"B":"A";d.deadline=Date.now()+20000;
  const m=S.matches.find(x=>x.id===d.mid);if(!rsvpLists(m).kadro.some(p=>!d.A.includes(p.id)&&!d.B.includes(p.id)))stopTimer();render(true)}

render(true);
load().then(async()=>{
  if(S.loaded&&!S.me&&S.players.length&&!LS.get("y_asked")){LS.set("y_asked","1");S.sheet={type:"me"};render(true)}
  if(S.pin){try{const r=await rpc("admin_check",{p_pin:S.pin});if(!r||!r.ok){S.admin=false;S.pin="";LS.del("y_pin");render(true)}}catch(_){}}
});
})();
</script>
